# Mutants no test can decide, excluded so that a mutation warning always
# means a missing test (issue #391's ruling; sweep evidence in run
# 33334414262). Two classes, both born from the property that makes the
# range coder fast, arithmetic modulo TOP under MASK:
#
#   equivalent        the mutant is the same program mod TOP, so no test
#                     can fail on it
#   non-terminating   the mutation destroys the renorm loop's only exit
#                     condition, so the mutant hangs instead of failing
#
# Lives in tests/, not .cargo/: .cargo/ is a Claude Code protected
# directory, so no restricted seat can write it, and the maintainer's run
# 35842553330 died on that wall answering #695 (agents/GOVERNANCE.md
# "Tool envelopes"). mutants-check.yml passes `--config tests/mutants.toml`;
# a local run needs the same flag or it sees none of these exclusions.
#
# The fail direction is chosen deliberately. An entry that drifts out of
# match lets noise resurface in the next sweep, which is visible and
# self-healing; an entry that over-matches hides a real mutant silently.
# So entries scope to function + operator only where every current match
# is proven, and pin file:line:col where the same function also contains
# catchable mutants of that operator (decode's `value` line, coder.rs:304,
# is catchable garbage, not a hang, and stays live).
#
# After editing src/coder.rs's constants or renormalization, re-verify:
# diff `cargo mutants --config tests/mutants.toml --package mothergod --list
# --colors=never` from
# before and after the edit; every newly excluded or re-appearing mutant
# must be explainable against this list.

exclude_re = [
  # Equivalent: every renorm branch ends in `(x << 1) & MASK`, so the
  # preceding `-= HALF` vs `+= HALF` differ by 2*HALF = TOP, which the
  # mask erases; QUARTER likewise (the shift doubles the 2*QUARTER gap
  # to TOP). Proof in #391. 10 mutants.
  "replace -= with \\+= in Encoder::encode$",
  "replace -= with \\+= in Decoder<'a>::decode$",

  # Equivalent: `(x << 1) | b` ORs into a bit position the shift just
  # cleared, so `|` and `^` agree. Same shape at every `|` in these four
  # functions. 5 mutants.
  "replace \\| with \\^ in Encoder::emit$",
  "replace \\| with \\^ in Encoder::encode$",
  "replace \\| with \\^ in Decoder<'a>::decode$",
  "replace \\| with \\^ in Decoder<'a>::decode_bits$",

  # Equivalent: base64 assembles disjoint 6-bit fields, so `|` on
  # non-overlapping bits equals `^`. 5 mutants.
  "replace \\| with \\^ in base64_unwrap::(try_decode|b64_encode)$",

  # Equivalent: field_bank ORs a 2-bit class index (bits 0-1) with
  # in_quotes shifted to bit 2, disjoint. banks ORs four more disjoint
  # pairs: prev1 (bits 0-7) with after_copy*ALPHABET (bit 8, ALPHABET
  # is 256); prev1<<8 (bits 8-15) with prev2 (bits 0-7); position&3
  # shifted to bits 4-5 with prev1>>4 (bits 0-3); and prev1>>4 (bits
  # 0-3) with after_copy*16 (bit 4). Every `|` in both functions ORs
  # operands whose bits cannot overlap, so `|` and `^` agree. Function
  # scope: every current `|` in each function is proven above; a `|`
  # added later to either function must repeat this proof or narrow to
  # file:line:col (issue #695). 5 mutants.
  "replace \\| with \\^ in field_bank$",
  "replace \\| with \\^ in banks$",

  # Equivalent: ResidualTree::decode ORs `top << raw`, whose low `raw`
  # bits are zero, with `decode_bits(raw)`, which sets only those bits, so
  # `|` and `^` agree. Function scope: this is the function's only `|`, and
  # a later one must repeat this proof or narrow to file:line:col (#932).
  # 1 mutant.
  "replace \\| with \\^ in ResidualTree::decode$",

  # Non-terminating: the renorm loops exit only when `low` and `high`
  # cross HALF or QUARTER. Pinning the interval (mask forced to ones) or
  # shrinking it monotonically (`<< 1` to `>> 1` drives `high` to 1 via
  # the `| 1`) makes the exit unreachable; encode also grows `out`
  # without bound. Encoder::encode's only `&` and `<<` sites are its two
  # shift lines, so function scope is exact there; Decoder<'a>::decode
  # also carries catchable `&` and `<<` mutants on its `value` line
  # (coder.rs:291), so its two shift lines are pinned instead. 8 mutants.
  "replace & with \\| in Encoder::encode$",
  "replace << with >> in Encoder::encode$",
  "^src/coder\\.rs:288:34: replace << with >>",
  "^src/coder\\.rs:288:40: replace & with \\|",
  "^src/coder\\.rs:289:37: replace << with >>",
  "^src/coder\\.rs:289:48: replace & with \\|",

  # Non-terminating, constant geometry: HALF doubled past TOP makes
  # `high < HALF` a tautology; MASK = TOP + 1 or TOP pins the interval
  # to {0, TOP} through the `& MASK` shifts. QUARTER's and
  # THREE_QUARTERS' mutants misprice the underflow branch but still
  # terminate, so they stay live. 3 mutants.
  "^src/coder\\.rs:24:23: replace >> with <<$",
  "^src/coder\\.rs:27:23: replace - with [+/]$",

  # Undecidable by cargo test: `try_new -> Result<Self, TryReserveError>`
  # with its body replaced by `Ok(Default::default())` is byte-identical
  # to the real code whenever the allocator succeeds, which under `cargo
  # test` is always; only an injected allocation failure tells them
  # apart, and that instrument is tests/torture.rs, which mutants-check
  # cannot run (#791). Four debt issues were this class and each closed
  # on a torture sweep by hand (#790, #815, #835, #838). Owned by
  # torture, not by a test here (ADR-0056). Function-agnostic on
  # purpose: a try_new whose Default is not its infallible twin is caught
  # by the ordinary tests regardless, so excluding its mutant loses
  # nothing.
  "::try_new -> Result<Self, std::collections::TryReserveError> with Ok\\((Default|Self)::default\\(\\)\\)$",
]
