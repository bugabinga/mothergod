# Held-out finals (research/corpus/POLICY.md, "Sourcing: borrowed and our
# own" / "Sealing"): Silesia and Canterbury, never committed to this repo
# (size and third-party copyright). Each entry pins one download by URL
# and the SHA-256 of the bytes as fetched — the compressed archive, not
# the decompressed corpus file. `bench::corpus::fetch_and_cache` refuses
# to return a file whose downloaded bytes don't hash to its pin.
#
# Decompression is wired: `bench::corpus::decompress_silesia` (bzip2) and
# `bench::corpus::extract_canterbury` (tar+gzip) turn a fetched entry's
# bytes into raw corpus file(s). Remaining `research/JOURNAL.md` S1-D2
# scope: the train/sealed/finals split plumbing, regret scoring, the CI
# baseline gate, progress-graph rendering, and a scheduled workflow
# exercising `--features corpus-fetch`.
#
