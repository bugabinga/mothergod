[package]
name = "mothergod-bench"
version = "0.0.1"
edition = "2024"
publish = false

[dependencies]
mothergod = { path = ".." }
# Held-out-final fetch-and-cache (research/corpus/POLICY.md) needs an
# HTTPS client and a checksum digest; ADR-0002's zero-runtime-dependency
# rule binds the core `mothergod` crate, not this tooling crate (fuzz/
# already carries its own dependency, libfuzzer-sys, on the same
# reasoning). `ureq`'s rustls backend keeps this pure Rust, no system
# OpenSSL to discover in CI. `sha2` is a well-audited digest
# implementation; a self-rolled SHA-256 is the wrong place to save a
# dependency when its only job is deciding whether a downloaded file is
# trustworthy. `bzip2-rs` and `flate2` (default `rust_backend`, i.e.
# `miniz_oxide`) decode Silesia's per-file bzip2 and Canterbury's
# gzip-compressed tarball without a system zlib/bzip2 to discover in CI;
# `tar` (default features off, so its `xattr` feature and that crate
# don't enter the tree) reads the tarball's entries in memory — nothing
# here extracts to disk. All five are optional, gated behind the
# `corpus-fetch` feature (off by default): `bench` is a root workspace
# default-member, so an unconditional dependency here would tax every
# PR's required `cargo test --all-targets` with this tree even though
# only the `corpus` module needs it. CLAUDE.md's required checks build
# default features only, so this keeps them at today's cost; a scheduled
# workflow exercising `--features corpus-fetch` is remaining scope
# (`research/JOURNAL.md` S1-D2), the same shape as `fuzz/`'s targets,
# which aren't in the fast PR gate either.
ureq = { version = "2", default-features = false, features = [
  "tls",
], optional = true }
sha2 = { version = "0.11", optional = true }
bzip2-rs = { version = "0.1.2", optional = true }
flate2 = { version = "1.1.9", optional = true }
tar = { version = "0.4.46", default-features = false, optional = true }

[features]
corpus-fetch = ["dep:ureq", "dep:sha2", "dep:bzip2-rs", "dep:flate2", "dep:tar"]

# Explicit rather than left to autobin discovery: this binary calls
# `corpus`/`reference`, both gated behind `corpus-fetch`, so it must not
# enter a default-features build (`cargo build --workspace`, CLAUDE.md's
# required `cargo test --all-targets`) the way `baseline_gate` and
# `render_baseline_graph` do.
[[bin]]
name = "finals_report"
required-features = ["corpus-fetch"]

[lints]
workspace = true
