[workspace]
members = ["bench"]
# CLAUDE.md's required checks invoke bare `cargo <cmd>` (no --workspace), so
# make that cover the bench crate too, not just the root package.
default-members = [".", "bench"]

[package]
name = "mothergod"
version = "0.0.1"
edition = "2024"
rust-version = "1.94"
license = "MIT"
description = "General purpose compression."
repository = "https://github.com/bugabinga/mothergod"
readme = "README.md"
keywords = ["compression", "decompression", "codec"]
categories = ["compression"]

[dependencies]

[lints]
workspace = true

[dev-dependencies]
# default-features off: this crate only builds strategies with prop_oneof!/
# prop_compose!/Just, none of which need fork/timeout (subprocess-isolated
# shrinking, irrelevant to our deterministic pure functions) or regex-syntax
# (regex-pattern string strategies, unused here).
proptest = { version = "1.11.0", default-features = false, features = ["std"] }

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
