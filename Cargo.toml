[workspace]
members = ["bench", "site-status"]
# CLAUDE.md's required checks invoke bare `cargo <cmd>` (no --workspace), so
# make that cover the bench and site-status crates too, not just the root
# package.
default-members = [".", "bench", "site-status"]

[package]
name = "mothergod"
version = "0.0.1"
edition = "2024"
rust-version = "1.94"
license = "MIT"
description = "General purpose compression."
repository = "https://github.com/bugabinga/mothergod"
readme = "README.md"
keywords = ["compression", "decompression", "codec"]
categories = ["compression"]

[dependencies]

[lints]
workspace = true

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
