[workspace]
members = ["bench"]
# CLAUDE.md's required checks invoke bare `cargo <cmd>` (no --workspace), so
# make that cover the bench crate too, not just the root package.
default-members = [".", "bench"]

[package]
name = "mothergod"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
description = "General purpose compression."
repository = "https://github.com/bugabinga/mothergod"
readme = "README.md"
keywords = ["compression", "decompression", "codec"]
categories = ["compression"]
# An allowlist, so a new top-level directory stays out of the crate by
# default. The agent realm (ADR-0010) never ships. tests/claims.rs reads
# site/, docs/benchmarks/ and research/progress.jsonl, none packaged, so
# it stays out and the shipped `cargo test` stays green. The one research
# file is include_bytes!'d by the unit tests under src/. tests/mutants.toml
# configures mutants-check.yml, so it stays out with the workflow.
include = [
  "/src",
  "/tests",
  "!/tests/claims.rs",
  "!/tests/mutants.toml",
  "/research/imports/session-1/mothergod.rs",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
]

[dependencies]

[lints]
workspace = true

[dev-dependencies]
# default-features off: this crate only builds strategies with prop_oneof!/
# prop_compose!/Just, none of which need fork/timeout (subprocess-isolated
# shrinking, irrelevant to our deterministic pure functions) or regex-syntax
# (regex-pattern string strategies, unused here).
proptest = { version = "1.11.0", default-features = false, features = ["std"] }

# harness = false: this binary re-execs itself per swept allocation call
# (tests/torture.rs's own docs), which libtest's harness has no hook for,
# and it must stay a fast no-op under a bare `cargo test --all-targets`
# (docs/TESTING.md's required-gate contract) rather than running its sweep
# every time.
[[test]]
name = "torture"
path = "tests/torture.rs"
harness = false

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
