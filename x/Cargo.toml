[package]
name = "cargo-x"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
dprint-plugin-typescript = "0.96.1"
markup_fmt = "0.27.3"
pretty_yaml = "0.6.0"
rumdl = { version = "0.2.60", default-features = false }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
taplo = { version = "0.14.0", default-features = false }
tempfile = "3.27"

[lints.rust]
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
