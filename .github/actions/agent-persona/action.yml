# Loads an agent's persona so personality text is single-sourced
# (operator directive): agents/personas/<role>.md, per-person only,
# exposed as the `text` output for workflow prompts to interpolate.
# Shared house voice lives in CLAUDE.md, which every agent session loads
# automatically.
name: agent-persona
description: Load agents/personas/<role>.md as a step output
inputs:
  role:
    description: Persona file name without extension (e.g. bdfl)
    required: true
outputs:
  text:
    description: The agent's persona text
    value: ${{ steps.load.outputs.text }}
runs:
  using: composite
  steps:
    - id: load
      shell: bash
      env:
        ROLE: ${{ inputs.role }}
      run: |
        persona="agents/personas/${ROLE}.md"
        if [ ! -f "$persona" ]; then
          echo "::error::unknown persona role: ${ROLE} (no $persona)"
          exit 1
        fi
        {
          echo 'text<<MOTHERGOD_PERSONA_EOF'
          cat "$persona"
          echo 'MOTHERGOD_PERSONA_EOF'
        } >> "$GITHUB_OUTPUT"
