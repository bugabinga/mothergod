name: agent-guard
description: >-
  Run gate for all agent workflows. Four independent reasons an agent must
  not run this cycle, all reported through the single `paused` output
  because all four mean the same thing to a workflow step: do not run.

  1. Global pause (ADR-0004): an open issue labeled `agents-paused` whose
     body may contain `RESUME-AT: <ISO-8601 UTC>`. While such an issue is
     open and RESUME-AT is in the future (or absent), every agent skips.
     Once RESUME-AT has passed this guard closes the issue and the run
     proceeds (auto-resume).

  2. Exhausted model ladder (ADR-0018): the agent's ladder in
     `agents/models.json` resolved against the ledger issue labeled
     `model-limits`. The guard emits `model_flag` for the first rung that
     is not currently rate-limited. If every rung is limited the agent
     skips, because the last configured rung is the floor (ADR-0018).

  3. Stale `issues: opened` wake (issue #175): a run queued behind another
     agent-bdfl run on the same concurrency lane can start after the
     issue that woke it was already closed by the run ahead of it in
     line. Scoped to the `opened` action only, because that is the one
     event where "closed" reliably means "already handled" rather than,
     say, an operator closing in disagreement.

  4. Second gear (issue #375, ADR-0039): the allowance projection below
     misses the reset AND this wake is discretionary, meaning the clock
     started it because nothing else did. A computed share of those wakes
     is skipped, evenly spread. Never an operator wake, an alarm, or a
     reviewer run: those pass `discretionary: false` and are not budget
     levers.

  The same file carries each role's effort level (ADR-0021), emitted as
  `effort_flag`. Empty means the session default. An unrecognized value is
  dropped with a log line rather than failing the run: a typo in a data
  file must not take an agent offline.

  Allowance projection (issue #202, #369): before resolving the ladder, the
  guard reads the `allowance-state` ledger (written by agent-audit) and
  projects the week-average seven-day burn, one reading's utilization over
  the window elapsed so far, against the next reset. When the projection
  misses the reset, it resolves this role's `thrift` block instead of its
  normal ladder/effort, if `agents/models.json` has one, and skips the wake
  outright when reason 4 also applies. Thrift is a discount, the skip is the
  brake: a cheaper model on the same number of wakes does not reduce the
  number of wakes, and that is what costs (ADR-0039).
  No restore step needed either direction: every wake re-projects from the
  latest reading, so a role graduates back to its normal tier on its own
  once the allowance shows slack, with no PR and no run remembering to do it.

  The log line always says which reason fired. A model-scoped limit never
  stops the other agents: that is the whole point of the ledger and the
  reason a per-model limit is not a global pause.
inputs:
  token:
    description: GitHub token with issues read/write
    required: true
  role:
    description: >-
      Agent role, keying into agents/models.json. Omit to skip ladder
      resolution entirely (emits an empty model_flag).
    required: false
    default: ""
  discretionary:
    description: >-
      'true' when nothing but the clock asked for this run, so the
      allowance governor may skip it (reason 4). The calling workflow
      decides, because only it knows what woke it. Default false: a seat
      that says nothing is on the responsive path.
    required: false
    default: "false"
outputs:
  paused:
    description: "'true' when this agent must not run: pause, stale wake, no model left, or throttled"
    value: ${{ steps.check.outputs.paused }}
  model_flag:
    description: "'--model <id>' for the first available rung, or '' for the action default"
    value: ${{ steps.check.outputs.model_flag }}
  effort_flag:
    description: "'--effort <level>' for this role, or '' for the session default"
    value: ${{ steps.check.outputs.effort_flag }}
runs:
  using: composite
  steps:
    - id: check
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        ROLE: ${{ inputs.role }}
        EVENT_NAME: ${{ github.event_name }}
        EVENT_ACTION: ${{ github.event.action }}
        ISSUE_NUMBER: ${{ github.event.issue.number }}
        DISCRETIONARY: ${{ inputs.discretionary }}
        RUN_NUMBER: ${{ github.run_number }}
      run: |
        set -euo pipefail
        paused=false
        model_flag=''
        effort_flag=''

        if [ "$EVENT_NAME" = issues ] && [ "$EVENT_ACTION" = opened ] && [ -n "$ISSUE_NUMBER" ]; then
          state="$(gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json state --jq .state)"
          if [ "$state" = CLOSED ]; then
            paused=true
            echo "Issue #$ISSUE_NUMBER was already closed before this queued run started; skipping."
          fi
        fi

        issue_json="$(gh issue list --repo "$GITHUB_REPOSITORY" --label agents-paused --state open --json number,body --limit 1)"
        number="$(jq -r '.[0].number // empty' <<<"$issue_json")"
        if [ -n "$number" ]; then
          resume_at="$(jq -r '.[0].body // ""' <<<"$issue_json" | sed -n 's/^RESUME-AT:[[:space:]]*//p' | head -n1 | tr -d '\r')"
          if [ -z "$resume_at" ]; then
            paused=true
            echo "Paused indefinitely by issue #$number (no RESUME-AT line)."
          else
            resume_epoch="$(date -u -d "$resume_at" +%s 2>/dev/null || echo '')"
            if [ -z "$resume_epoch" ]; then
              paused=true
              echo "Paused by issue #$number; RESUME-AT '$resume_at' is unparseable, staying paused. Fix or close the issue to resume."
            elif [ "$(date -u +%s)" -lt "$resume_epoch" ]; then
              paused=true
              echo "Paused until $resume_at by issue #$number."
            else
              gh issue close "$number" --repo "$GITHUB_REPOSITORY" \
                --comment "RESUME-AT ($resume_at) has passed, agent operations resume with this run." || true
              echo "Pause expired; closed issue #$number, resuming."
            fi
          fi
        fi

        # Ladder resolution runs only when the global pause did not fire:
        # a paused fleet has nothing to resolve, and reading the ledger
        # would be wasted API calls.
        if [ "$paused" = false ] && [ -n "$ROLE" ]; then
          ledger_body="$(gh issue list --repo "$GITHUB_REPOSITORY" --label model-limits --state open --json body --limit 1 --jq '.[0].body // ""')"
          allowance_body="$(gh issue list --repo "$GITHUB_REPOSITORY" --label allowance-state --state open --json body --limit 1 --jq '.[0].body // ""')"
          resolved="$(ROLE="$ROLE" LEDGER="$ledger_body" ALLOWANCE="$allowance_body" \
            python3 .github/scripts/guard-decide.py)"
          IFS='|' read -r status model effort note <<<"$resolved"
          case "$status" in
            skip)
              paused=true
              echo "$note"
              ;;
            exhausted)
              paused=true
              echo "model: $note"
              ;;
            *)
              [ -n "$model" ] && model_flag="--model $model"
              [ -n "$effort" ] && effort_flag="--effort $effort"
              echo "model: $note"
              echo "effort: ${effort:-session default}"
              ;;
          esac
        fi

        echo "paused=$paused" >> "$GITHUB_OUTPUT"
        echo "model_flag=$model_flag" >> "$GITHUB_OUTPUT"
        echo "effort_flag=$effort_flag" >> "$GITHUB_OUTPUT"
