name: agent-pause
description: >-
  Usage-limit detector (ADR-0004). Inspects the claude-code-action execution
  log's STRUCTURED RESULT entries for a genuine usage-limit failure and, on
  hit, opens the `agents-paused` issue with a RESUME-AT timestamp: +6h for
  rolling-window limits, +24h for weekly limits. Idempotent: does nothing if
  a pause issue is already open.

  Invariant (issue #11 post-mortem, 2026-08-21): only error result objects
  are scanned, never the conversation transcript. This repo's prompts and
  docs legitimately contain phrases like "usage limit" because they describe
  this very machinery; grepping the full transcript pauses the system on its
  own documentation. A successful run must never pause, whatever its text
  mentions.
inputs:
  token:
    description: GitHub token with issues read/write
    required: true
  execution_file:
    description: Path to the claude-code-action execution output file
    required: false
    default: ''
  telegram_bot_token:
    description: Telegram status-bot token (optional; alerts skip if empty)
    required: false
    default: ''
  telegram_chat_id:
    description: Operator's Telegram chat id (optional; alerts skip if empty)
    required: false
    default: ''
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        EXEC_FILE: ${{ inputs.execution_file }}
        TG_TOKEN: ${{ inputs.telegram_bot_token }}
        TG_CHAT: ${{ inputs.telegram_chat_id }}
      run: |
        set -euo pipefail
        if [ -z "$EXEC_FILE" ] || [ ! -f "$EXEC_FILE" ]; then
          echo "No execution file to scan; skipping usage-limit check."
          exit 0
        fi
        verdict="$(python3 - "$EXEC_FILE" <<'PY'
        import json, re, sys

        raw = open(sys.argv[1], encoding="utf-8", errors="replace").read()
        entries = []
        try:
            data = json.loads(raw)
            entries = data if isinstance(data, list) else [data]
        except json.JSONDecodeError:
            for line in raw.splitlines():
                line = line.strip()
                if line:
                    try:
                        entries.append(json.loads(line))
                    except json.JSONDecodeError:
                        pass

        # Only failed result objects count — see the invariant in the
        # action description.
        text = " ".join(
            json.dumps(e).lower()
            for e in entries
            if isinstance(e, dict) and e.get("type") == "result" and e.get("is_error")
        )
        m = re.search(r"usage[ _]limit|weekly limit|5-hour limit|out of extra usage", text)
        if not m:
            print("none")
        elif "weekly limit" in text:
            print("weekly:" + m.group(0))
        else:
            print("rolling:" + m.group(0))
        PY
        )"
        if [ "$verdict" = "none" ]; then
          echo "No usage-limit error in the session result; not pausing."
          exit 0
        fi
        hours=6
        case "$verdict" in weekly:*) hours=24 ;; esac
        hit="${verdict#*:}"
        resume_at="$(date -u -d "+${hours} hours" +%Y-%m-%dT%H:%M:%SZ)"
        existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --label agents-paused --state open --json number --jq '.[0].number // empty')"
        if [ -n "$existing" ]; then
          echo "Pause issue #$existing already open; not creating another."
          exit 0
        fi
        gh label create agents-paused --repo "$GITHUB_REPOSITORY" \
          --color D93F0B --description "Agent system is paused (ADR-0004)" 2>/dev/null || true
        body="$(printf 'The agent system hit a Claude subscription usage limit (marker: `%s`, run: %s).\n\nRESUME-AT: %s\n\nAll agent workflows skip while this issue is open; the first scheduled run after RESUME-AT closes it and resumes automatically. Close it manually to resume earlier, or delete the RESUME-AT line to pause indefinitely.\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_' "$hit" "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" "$resume_at")"
        gh issue create --repo "$GITHUB_REPOSITORY" \
          --title "⏸️ Agents paused: Claude usage limit reached" \
          --label agents-paused \
          --body "$body"
        echo "Agent system paused until $resume_at."
        if [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ]; then
          curl -sS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=⏸️ mothergod agents paused (Claude usage limit, marker: ${hit}). Auto-resume at ${resume_at} UTC. Close the agents-paused issue to resume earlier." \
            >/dev/null && echo "Telegram pause alert sent." || echo "Telegram alert failed (non-fatal)."
        fi
