# Weekly tests for `bench`'s opt-in `corpus-fetch` feature.
#
# `bench/Cargo.toml`: `corpus-fetch` gates the fetch/decompress code (and its
# ureq/sha2/bzip2-rs/flate2/tar dependency tree) behind an off-by-default
# feature so ci.yml's required `cargo test --all-targets` never pays for it.
# `cargo x lint` and `cargo x doc` turn the feature on, so the module's
# clippy and rustdoc run on every PR (#1058 and #1645 each sat red here for
# a week while this run was the module's only lint). What the PR gate cannot
# run is here: the module's tests, including
# `fetch_and_cache_smoke_tests_the_real_pins` (`bench/src/corpus.rs`),
# `#[ignore]`d because it hits the real network. It catches a
# `bench/corpus.toml` pin going stale (URL moved, checksum drifted) before
# an experiment run needs the real corpus.
name: corpus-fetch-check

on:
  schedule:
    # Sunday 05:41 UTC: same weekly cadence as the other advisory sweeps
    # (codeql 04:07, agent-model-intel 05:07, monster Saturday 03:17), offset
    # so they don't contend for runners.
    - cron: "41 5 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: corpus-fetch-check
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: --deny warnings

jobs:
  corpus-fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/rust-ci
        with:
          checks: setup
      - run: cargo test -p mothergod-bench --features corpus-fetch --all-targets -- --include-ignored
