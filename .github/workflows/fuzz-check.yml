# Nightly cargo-fuzz run with a persistent corpus (#450, ADR-0043 layer 3).
#
# ROADMAP M4's "cargo-fuzz targets ... in scheduled CI", journal lead S1-P7:
# `fuzz/` (research/JOURNAL.md S2-A25, issue #53) carries the libFuzzer
# targets, and this workflow does not name them: it fuzzes whatever
# `cargo fuzz list` reports. Time-boxed here, not the fast per-PR gate,
# because libFuzzer's sanitizer-coverage instrumentation is nightly-only and
# a real fuzz run's runtime doesn't belong on every push. Fuzzing compounds
# only if coverage survives the run: the corpus persists through the actions
# cache, each night resumes from the last night's frontier, and `cmin` keeps
# the saved corpus minimal. A found crasher fails the job here; promoting it
# to a `tests/adversarial/` regression seed is a follow-up PR, same as any
# other bug found in CI.
name: fuzz-check

on:
  schedule:
    # Nightly 02:13 UTC: compounding needs cadence (#450). Offset clear of
    # the other scheduled sweeps (monster 03:17, codeql 04:07,
    # agent-model-intel 05:07, corpus-fetch-check 05:41) so they don't
    # contend for runners.
    - cron: "13 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-check
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    # ~2 min build and setup (observed on the weekly runs), FUZZ_BUDGET_S
    # of fuzzing whatever the target count, cmin and cache save on top.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The corpus persists across runs (#450). Cache keys are write-once,
      # so every run saves under its own run-id key and restores the newest
      # prior corpus by prefix: the standard workaround, and the reason the
      # restore below never expects an exact hit. The save happens in the
      # post-job step, which runs even when a fuzz step failed, because the
      # coverage learned on the way to a crasher is the most expensive kind
      # to lose.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      # fuzz/rust-toolchain.toml pins nightly; install it explicitly rather
      # than relying on rustup's implicit auto-install, so a missing
      # toolchain fails loudly instead of silently costing the first
      # fuzz-run step its time budget.
      - run: rustup toolchain install nightly --profile minimal --no-self-update
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-${{ runner.os }}-0.13.2
      # Guarded by the binary, not left to `cargo install`'s own check: the
      # cache restores only the binary, not ~/.cargo/.crates.toml, so an
      # unguarded install would rebuild from source on every hit.
      - run: test -x ~/.cargo/bin/cargo-fuzz || cargo install cargo-fuzz --version 0.13.2 --locked
      # Built outside the timed steps below so the ledger's fuzz_cpu_s
      # measures fuzzing, not compilation.
      - name: build fuzz targets
        working-directory: fuzz
        run: cargo fuzz build
      # Deterministic valid-frame seeds (#475): frame_gen's 12 seeds lift
      # decode_arbitrary from cov 26 to cov 418 before the first mutation
      # (measured 2026-09-02, that build). Idempotent, same named files
      # every run; cmin prunes any duplicates against an already-learned
      # corpus. Before the census so the census reflects it.
      - name: seed corpus
        working-directory: fuzz
        run: cargo run --bin seed_corpus
      # The census brackets the run: this one against the same step after
      # cmin shows what tonight learned, and against yesterday's log shows
      # whether the corpus compounds across runs (#450's acceptance test).
      - name: corpus census (restored)
        run: |
          mkdir -p fuzz/corpus
          find fuzz/corpus -type f | awk -F/ '{c[$3]++} END {for (t in c) print t ": " c[t] " input(s)"; if (!length(c)) print "corpus: empty"}'
      # Targets are discovered, never listed here (#492). `cargo fuzz list`
      # reads fuzz/Cargo.toml's [[bin]] entries, where a target's existence
      # is already decided; a second list here failed silently, because a
      # target missing from it is never fuzzed and no check goes red.
      #
      # The nightly's wall clock is the budget and the target count is the
      # divisor. A new target therefore costs the others depth, never the
      # operator more runner minutes, and can never push this job past its
      # timeout. That trade is right for a corpus that persists: depth lost
      # on one night is recovered across nights, a silent timeout is not.
      #
      # Every target runs even after one crashes. libFuzzer exits the
      # instant it finds a crasher, so continuing costs nearly nothing, and
      # a bug in the first target must not cost the rest their night. The
      # aggregated exit code still fails the job, which is what skips cmin
      # below. Each target is timed individually and the times are summed
      # for the ledger, so a crasher's early exit still reports true
      # elapsed time; the crash case is the one the ledger most wants a
      # real number for (#449).
      - name: fuzz all targets
        working-directory: fuzz
        env:
          FUZZ_BUDGET_S: 1800
        run: |
          targets=$(cargo fuzz list)
          test -n "$targets" || { echo "cargo fuzz list reported no targets"; exit 1; }
          count=$(echo "$targets" | wc -l)
          each=$((FUZZ_BUDGET_S / count))
          # A slice this thin is not a fuzz run, and 0 means "no limit" to
          # libFuzzer, i.e. a hang until timeout-minutes. Say which knob to
          # turn rather than silently doing either.
          test "$each" -ge 60 || { echo "$count targets leaves ${each}s each; raise FUZZ_BUDGET_S and timeout-minutes"; exit 1; }
          echo "$count target(s), ${each}s each"
          rc=0
          for t in $targets; do
            t0=$SECONDS
            cargo fuzz run "$t" -- -max_total_time="$each" || rc=$?
            echo $((SECONDS - t0)) >> ../fuzz-seconds.txt
          done
          exit $rc
      # cmin keeps the persisted corpus minimal without losing coverage.
      # Success path only, deliberately: on a crasher run these steps skip
      # and the post-job save persists the unminimized corpus, which is
      # correct, because cmin re-executes every input and a corpus that
      # just produced a crash would only crash again here.
      - name: minimize corpus
        working-directory: fuzz
        run: |
          for t in $(cargo fuzz list); do
            cargo fuzz cmin "$t"
          done
      - name: corpus census (after cmin)
        run: |
          find fuzz/corpus -type f | awk -F/ '{c[$3]++} END {for (t in c) print t ": " c[t] " input(s)"}'
      - name: upload crashers
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
      # The trust-ledger entry (#449, ADR-0043): one small JSON artifact
      # per run, aggregated by .github/scripts/trust-telemetry.py at site
      # deploy time. if: always() because the crasher-found run is the one
      # whose entry matters most. Fields this workflow does not measure
      # stay null; #455 (mutation) and #454 (coverage) own theirs.
      - name: build trust-ledger entry
        if: always()
        run: |
          crashers=$(find fuzz/artifacts -type f 2>/dev/null | wc -l)
          seconds=$(cat fuzz-seconds.txt 2>/dev/null | awk '{s+=$1} END {print s+0}')
          printf '{"date":"%s","run_id":"%s","role":"fuzz","fuzz_cpu_s":%s,"crashers_new":%s,"mutation_score":null,"coverage_region_pct":null}\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_RUN_ID" "$seconds" "$crashers" > entry.json
      - name: upload trust-ledger entry
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trust-fuzz-${{ github.run_id }}-${{ github.run_attempt }}
          path: entry.json
          retention-days: 90
