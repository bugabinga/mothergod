# Researcher: the weekly autoresearch-loop session (JOURNAL / ADR-0003).
# One experiment per session: propose → guard → benchmark → verdict → record.
name: agent-research

on:
  schedule:
    - cron: "23 6 * * 6" # Saturdays
  workflow_dispatch:

permissions: {}

# Per-agent group (ADR-0014): research runs debounce against each other
# only, never blocking an operator-priority BDFL wake.
concurrency:
  group: agent-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: guard
        uses: ./.github/actions/agent-guard
        with:
          token: ${{ github.token }}
          role: researcher

      - uses: dtolnay/rust-toolchain@stable
        if: steps.guard.outputs.paused != 'true'
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        if: steps.guard.outputs.paused != 'true'

      - id: claude
        if: steps.guard.outputs.paused != 'true'
        uses: anthropics/claude-code-action@v1
        env:
          # Job-scoped fallback for gh writes after the claude app token
          # expires ~1h into a session (issue #81). Comments only, never
          # pushes or merges (GOVERNANCE.md "Push identity").
          GH_WORKFLOW_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_commit_signing: true
          prompt: |
            This session chooses, runs, and records one compression
            experiment, or the codec or benchmark capability patch needed to
            measure it; use `compression-experiment` for that work.
            Workflow-only schedule or attribution-footer changes do not.

            Hard rules: one experiment, one PR on branch
            claude/research-<slug>, never merge, stop when recorded. If the
            work dies for an environmental reason, post the exact blocker on
            the ops-log issue without a verdict. Never fabricate numbers;
            every number you write was produced by a command in this session.
            End every posted body with the attribution footer: a blank line,
            `---`, then `_Generated by [Claude Code](https://claude.ai/code)_`.
          # Bash unrestricted, per agents/GOVERNANCE.md "Tool envelopes".
          claude_args: |
            --append-system-prompt-file agents/personas/researcher.md
            ${{ steps.guard.outputs.model_flag }}
            ${{ steps.guard.outputs.effort_flag }}
            --max-turns 500
            --allowedTools "Edit,Write,MultiEdit,Bash,WebSearch,WebFetch"

      - if: always() && steps.claude.outcome != 'skipped'
        uses: ./.github/actions/agent-pause
        with:
          token: ${{ github.token }}
          execution_file: ${{ steps.claude.outputs.execution_file }}
          telegram_bot_token: ${{ secrets.MOTHERGOD_STATUS_BOT_TOKEN }}
          telegram_chat_id: ${{ vars.OPERATOR_TELEGRAM_CHAT_ID }}

      # Audit trail (operator directive): prompt and metadata in, final
      # response out. Never the transcript, which records command lines and
      # can carry credentials. Must not fail the run.
      - if: always() && steps.claude.outcome != 'skipped'
        continue-on-error: true
        uses: ./.github/actions/agent-audit
        with:
          token: ${{ github.token }}
          role: researcher
          execution_file: ${{ steps.claude.outputs.execution_file }}
          redact: |
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
            ${{ secrets.MOTHERGOD_ADMIN_TOKEN }}
            ${{ secrets.MOTHERGOD_STATUS_BOT_TOKEN }}
            ${{ secrets.CLOUDFLARE_API_TOKEN }}
