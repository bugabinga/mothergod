# Researcher: the weekly autoresearch-loop session (JOURNAL / ADR-0003).
# One experiment per session: propose → guard → benchmark → verdict → record.
name: agent-research

on:
  schedule:
    - cron: '23 6 * * 6' # Saturdays
  workflow_dispatch:

permissions: {}

# Per-agent group (ADR-0014): research runs debounce against each other
# only, never blocking an operator-priority BDFL wake.
concurrency:
  group: agent-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: guard
        uses: ./.github/actions/agent-guard
        with:
          token: ${{ github.token }}
          role: researcher

      - uses: dtolnay/rust-toolchain@stable
        if: steps.guard.outputs.paused != 'true'
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        if: steps.guard.outputs.paused != 'true'

      - id: persona
        if: steps.guard.outputs.paused != 'true'
        uses: ./.github/actions/agent-persona
        with:
          role: researcher

      - id: claude
        if: steps.guard.outputs.paused != 'true'
        uses: anthropics/claude-code-action@v1
        env:
          # Job-scoped fallback for gh writes after the claude app token
          # expires ~1h into a session (issue #81). Comments only, never
          # pushes or merges (GOVERNANCE.md "Push identity").
          GH_WORKFLOW_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_commit_signing: true
          prompt: |
            ${{ steps.persona.outputs.text }}

            One experiment this session, run to the loop contract below.
            Read first: research/JOURNAL.md (laws, rejections, standing
            leads), research/README.md (progress.jsonl schema),
            research/corpus/POLICY.md, ROADMAP.md, CLAUDE.md.

            Prerequisite check: if the benchmark harness (ROADMAP M2) or the
            codec itself (M1) is not yet capable of measuring an experiment,
            then this session's "experiment" is building the next smallest
            slice of that capability instead — treat it as kind="patch" work
            and still record it. Capability work shares the heartbeat's
            lane and agents run concurrently (ADR-0014): check open PRs and
            claude/* branches first, and build the next slice nobody has in
            flight.

            Language rule (ADR-0006): experiments run against the in-repo
            Rust codec; all new code — experiments, harness, corpus tooling —
            is Rust, and no Python enters the tree. The founding Python loop
            is preserved in git history (commit 1a3b1c8 under
            research/imports/session-1/); to consult it as an oracle,
            extract it to a scratch directory outside the repo, run it
            read-only, and quote its numbers only as clearly-marked
            historical model-cost context.

            Otherwise pick exactly ONE, defaulting to the first:
            a) the journal's top standing lead (kind=patch or param),
            b) a literature merge: search the web for recent compression
               research or state-of-the-art code, pick ONE implementable
               idea, cite the source (kind=literature),
            c) a wild swing — an unreasonable-sounding idea worth one cheap
               test (kind=wild).

            The loop contract:
            1. Hypothesis: one sentence, falsifiable, with an expected
               bits/byte effect and target data class.
            2. Implement on branch claude/research-<slug>.
            3. Guards before measuring: round-trip on every corpus class
               including adversarial inputs; the experiment must not modify
               the benchmark, corpus, or guards in the same change
               (JOURNAL S1-L5).
            4. Measure on rotating train slices AND the sealed validation
               set. Accept only if train improves and validation does not
               regress (S1-L7). Record slice sizes (S1-L4).
            5. Verdict and record, whatever the outcome: append a JOURNAL.md
               entry (mechanism, not just score) and a progress.jsonl line
               per the schema. Rejected: open a PR containing ONLY the
               journal/progress entries. Accepted: open a PR with the code
               plus the entries, CHANGELOG updated.

            Hard rules: one experiment, one PR, never merge, stop when
            recorded. If the experiment dies for an environmental reason,
            record that too — an ops note on the ops-log issue instead of a
            fabricated verdict. Never fabricate numbers; every number you
            write was produced by a command in this session. End
            every posted body with the attribution footer: a blank line,
            `---`, then `_Generated by [Claude Code](https://claude.ai/code)_`.
          claude_args: |
            ${{ steps.guard.outputs.model_flag }}
            --max-turns 500
            --allowedTools "Edit,Write,MultiEdit,Bash(cargo:*),Bash(rustup:*),Bash(git:*),Bash(gh:*),Bash(rustc:*),Bash(python3:*),Bash(curl:*),WebSearch,WebFetch"

      - if: always() && steps.claude.outcome != 'skipped'
        uses: ./.github/actions/agent-pause
        with:
          token: ${{ github.token }}
          execution_file: ${{ steps.claude.outputs.execution_file }}
          telegram_bot_token: ${{ secrets.MOTHERGOD_STATUS_BOT_TOKEN }}
          telegram_chat_id: ${{ vars.OPERATOR_TELEGRAM_CHAT_ID }}

      # Audit trail (operator directive): prompt and metadata in, final
      # response out. Never the transcript, which records command lines and
      # can carry credentials. Must not fail the run.
      - if: always() && steps.claude.outcome != 'skipped'
        continue-on-error: true
        uses: ./.github/actions/agent-audit
        with:
          role: researcher
          execution_file: ${{ steps.claude.outputs.execution_file }}
          redact: |
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
            ${{ secrets.MOTHERGOD_ADMIN_TOKEN }}
            ${{ secrets.MOTHERGOD_STATUS_BOT_TOKEN }}
            ${{ secrets.CLOUDFLARE_API_TOKEN }}
