# Herald: twice daily, owns making the human-facing surface: the
# site, the README's reader experience, release-notes voice,
# positioning, the marketing journal (ADR-0040). The BDFL steers the
# seat; the reviewer approves its PRs; it never merges.
name: agent-herald

on:
  # Woken at 06:49 and 18:49 UTC by the worker clock (ADR-0035); the
  # cron lines in infra/telegram-worker/wrangler.toml are the cadence's
  # source of truth. Never a native `schedule:` trigger here: GitHub's
  # schedule-actor attribution breaks the app-token exchange on
  # bot-edited files (GOVERNANCE.md "Push identity").
  workflow_dispatch:
    inputs:
      source:
        description: >-
          'cron' when the worker clock's tick dispatched this run
          (ADR-0035); left at the default for a human dispatch. Only
          the clock's tick is discretionary, so only it can be skipped
          by the allowance governor (ADR-0039).
        required: false
        default: manual

permissions: {}

# Per-agent group (ADR-0014): herald runs debounce against each other
# only, never blocking another agent.
concurrency:
  group: agent-herald
  cancel-in-progress: false

jobs:
  herald:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: guard
        uses: ./.github/actions/agent-guard
        with:
          token: ${{ github.token }}
          role: herald
          discretionary: ${{ inputs.source == 'cron' }}

      - uses: dtolnay/rust-toolchain@stable
        if: steps.guard.outputs.paused != 'true'
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        if: steps.guard.outputs.paused != 'true'

      - id: claude
        if: steps.guard.outputs.paused != 'true'
        uses: anthropics/claude-code-action@v1
        env:
          # Job-scoped fallback for gh writes after the claude app token
          # expires ~1h into a session (issue #81). Comments only, never
          # pushes or merges (GOVERNANCE.md "Push identity").
          GH_WORKFLOW_TOKEN: ${{ github.token }}
          # gh-comment assembles the attribution footer from this.
          ROLE: herald
          # Read access to mothergod.dev analytics for the USERS survey
          # (ADR-0040); granted per the secrets row of GOVERNANCE.md's
          # decision table. Zone-scoped, never printed (CLAUDE.md rule
          # 10).
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_commit_signing: true
          prompt: |
            Read marketing/JOURNAL.md through its headings (ADR-0025):
            your institutional memory; ADR-0040 is your charter. When
            work changes site/, page layout, styling, browser
            interaction, or accessibility, use the `web-ui` skill.

            Territory, the human-facing surface: site/, README.md's
            reader experience, CHANGELOG.md and release-notes voice,
            positioning, marketing/, owned channels registered in
            agents/IDENTITIES.md. Not src/, not docs/format/, not
            agents/ or .github/ (propose machinery changes as
            agent-system issues instead), and never another agent's
            prose.

            Work in strict priority order and STOP after ONE unit of
            work:
            1. Your own open PRs that are red or labeled
               changes-requested, oldest first: check out the branch,
               fix it, push with `.github/scripts/push-branch`, then
               run `.github/scripts/settle-push <pr>` and trust its
               exit code. The reviewer's items are in its comment on
               the thread; a labeled PR with no push after that
               comment is yours.
            2. Weekly survey: when marketing/JOURNAL.md has no survey
               entry dated within the last 6 days, run the
               `audience-survey` skill; skip it otherwise.
            3. Otherwise ship one improvement. Queue first: the top
               open issue labeled marketing nobody has claimed (an open
               PR or claude/* branch covering it means claimed). Queue
               empty: find the biggest reader-facing defect on the
               surface yourself, a stale or false claim, a page that
               serves no audience, a missing next step, and fix that.
               Branch claude/herald-<slug>, smallest useful slice, push
               with `.github/scripts/push-branch`, then a PR.

            The PR body is your report: what a reader gets that they
            did not have, which audience it serves, and the evidence
            behind every claim the change makes. Editorial decisions
            worth remembering go in marketing/JOURNAL.md in the same
            PR.

            Hard rules: publish only on owned channels
            (agents/IDENTITIES.md); external platforms are read-only
            instruments, and astroturfing in any form is a mission
            violation. Update CHANGELOG.md only for user-visible
            product changes.
          # Bash unrestricted, per agents/GOVERNANCE.md "Tool envelopes".
          # WebFetch/WebSearch: the survey's read-only instruments.
          claude_args: |
            --append-system-prompt-file agents/personas/herald.md
            ${{ steps.guard.outputs.model_flag }}
            ${{ steps.guard.outputs.effort_flag }}
            --max-turns 300
            --allowedTools "Edit,Write,MultiEdit,Bash,WebFetch,WebSearch"

      - if: always() && steps.claude.outcome != 'skipped'
        uses: ./.github/actions/agent-pause
        with:
          token: ${{ github.token }}
          execution_file: ${{ steps.claude.outputs.execution_file }}
          telegram_bot_token: ${{ secrets.MOTHERGOD_STATUS_BOT_TOKEN }}
          telegram_chat_id: ${{ vars.OPERATOR_TELEGRAM_CHAT_ID }}
          cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Audit trail (operator directive): prompt and metadata in, final
      # response out. Never the transcript, which records command lines and
      # can carry credentials. Must not fail the run.
      - if: always() && steps.claude.outcome != 'skipped'
        continue-on-error: true
        uses: ./.github/actions/agent-audit
        with:
          token: ${{ github.token }}
          role: herald
          execution_file: ${{ steps.claude.outputs.execution_file }}
          redact: |
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
            ${{ secrets.MOTHERGOD_ADMIN_TOKEN }}
            ${{ secrets.MOTHERGOD_STATUS_BOT_TOKEN }}
            ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Run notice (operator directive, Telegram, 2026-09-01): herald runs
      # land in the operator's Telegram as a short summary, same mechanism
      # as heartbeat runs; agent-heartbeat.yml carries the rationale.
      # Runs after agent-audit because it reads that step's scrubbed files.
      - if: always() && steps.claude.outcome != 'skipped'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.MOTHERGOD_STATUS_BOT_TOKEN }}
          OPERATOR_TELEGRAM_CHAT_ID: ${{ vars.OPERATOR_TELEGRAM_CHAT_ID }}
        run: |
          .github/scripts/run-notice.py "${RUNNER_TEMP}/agent-audit" herald \
            | .github/scripts/tg-send --notice

      # Visual evidence (operator directive, Telegram, 2026-09-20; #636,
      # #658): before/after stills of every site/ page a branch this run
      # pushed changes, delivered as one media group per page. A post-run
      # step rather than a session duty, so the session holds no bot token
      # and a run that dies after pushing still ships what it pushed. Reads
      # push-branch's own record of the pushes, so a run that never touched
      # site/ costs one file read.
      - if: always() && steps.claude.outcome != 'skipped'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.MOTHERGOD_STATUS_BOT_TOKEN }}
          OPERATOR_TELEGRAM_CHAT_ID: ${{ vars.OPERATOR_TELEGRAM_CHAT_ID }}
        run: |
          # tg-photo runs whatever site-shots' exit was: a failed shot is an
          # error line plus the manifest of every shot that succeeded, and
          # those still go. The exit is kept so the step reads red in the log.
          shots=0
          .github/scripts/site-shots "${RUNNER_TEMP}/site-shots" || shots=$?
          .github/scripts/tg-photo "${RUNNER_TEMP}/site-shots"
          exit "$shots"
