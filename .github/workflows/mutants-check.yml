# Mutation testing: a surviving mutant is a missing test by definition.
#
# ROADMAP M4's "cargo-mutants in CI" (docs/TESTING.md layer 4). It runs on
# the PR's own changed lines, not on a weekly sweep of the whole crate,
# because the two shapes carry different signal. Measured 2026-08-30 on
# `src/` at 9,086 lines: the crate generates 1,531 mutants at roughly 9s
# each with `-j 4`, so a full sweep is ~3.8h and re-reports a survivor list
# that only changes when someone changes `src/`. A weekly report nobody
# reads manufactures the appearance of coverage. `--in-diff` instead reds
# the PR that created the survivor, at the moment fixing it is cheapest,
# in single-digit minutes. The same run on merged PR #384's diff found 3
# missed mutants in `decodes_incrementally` in 2m45s, one of which that
# PR's review had already flagged by eye.
#
# The full sweep survives as `workflow_dispatch`: the backlog in code that
# predates this gate is a one-time measurement, so it gets a button, not a
# cron.
#
# Both modes mutate `--package mothergod` alone: `bench` and `x` measure and
# orchestrate, they are not the codec under test.
#
# `--timeout-multiplier 10` doubles cargo-mutants' default of 5x the baseline
# test duration, because the default's anchor is measured under conditions it
# is not spent under. On the 2026-08-30 full sweep (run 33334414262) the
# baseline test phase ran alone and took 8.0s, so cargo-mutants auto-set a
# 40s wall; the mutants then ran four-wide at `-j 4`, where that same suite
# took 24.8s (`log/src__coder.rs_line_271_col_26_001.log`). 40s over 24.8s
# is 1.6x of real margin, and 56 of 1,531 mutants crossed it.
#
# Those 56 are three outcomes, not one. Counted from the sweep's artifact:
#
#   28  a test had already reported `FAILED` when the clock ran out.
#       `cargo test` has no fail-fast within a binary, so a caught mutant
#       keeps running the rest of the suite after the failure that decided
#       it. A bigger budget recovers these as `caught`, which is coverage
#       the gate already had and was throwing away.
#   20  progress but no failure yet. Undecided in the honest sense. A
#       bigger budget resolves them either way, and some will resolve as
#       genuine survivors.
#    8  zero completed tests in the whole 40s, every one in `coder.rs`'s
#       renormalization (lines 23, 26, 133, 134, 287). Mutating a mask or
#       a shift inside a loop whose only exit is `low` and `high` crossing
#       HALF or QUARTER can leave the loop with no exit at all. These do
#       not time out because the budget is tight, they time out because
#       the mutant does not terminate, and a bigger budget buys 80s of
#       hanging instead of 40s. `.cargo/mutants.toml` excludes that class
#       and the equivalent mutants, each with its proof (#391's ruling).
#
# So the flag recovers 28, decides 20, and wastes time on 8. 10x is a
# doubling, not a measurement: the tail past 40s stays unknown until the
# next dispatched sweep reports it, and the flag is cheap to raise again.
#
# Not required by the ruleset. cargo-mutants emits `::warning file=...`
# annotations, so a missed mutant lands on the changed line in the PR diff
# where a reviewer already looks. Promote it to a required check once four
# weeks pass with no false positive, counted from the exclusion baseline
# (.cargo/mutants.toml, merged 2026-08-31). Counted on 2026-09-23: two,
# not zero. #676 and #677 each merged with a `|`/`^` survivor in bank
# hashing, the disjoint-field class mutants.toml already excludes by proof
# elsewhere, so a required check would have blocked both on an equivalent
# mutant. The clock restarts when those two are excluded with their proofs.
#
# An advisory red has a reader only while the PR is open: the reviewer's
# session ends with its verdict, merge-pr lands the PR on the required
# gates alone, and a red that finishes afterwards sits on a thread no seat
# sweeps. #676, #677 and #690 all merged that way in two days, #690 with
# 50 survivors among 84 decided mutants and 20 never run inside the
# 25-minute budget. The last step, `mutants-debt`, closes that gap: on a
# merged PR the survivors become one `product`+`bug` issue, the heartbeat's
# first pickup tier; on an open PR the annotations stay the reader. Its
# docstring is the contract. Forks are skipped by the `if:` because their
# token cannot write issues, and a fork PR's red is the reviewer's to read
# before merging, same as before.
name: mutants-check

on:
  pull_request:
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/mutants.toml"
      - ".github/workflows/mutants-check.yml"
  workflow_dispatch:

# Raised per job below; the mutants job writes one issue on a merged PR.
permissions: {}

concurrency:
  group: mutants-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  mutants:
    runs-on: ubuntu-24.04
    permissions:
      contents: read # checkout
      pull-requests: read # mutants-debt reads the PR's merged state
      issues: write # mutants-debt files a merged PR's survivors
    # The ceiling for the dispatched full sweep; each mode's real budget is
    # its own step timeout below, so a hung PR gate never holds a runner for
    # the sweep's allowance.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # --merge-base needs the base branch present, not just the merge ref.
          fetch-depth: 0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-mutants
          key: cargo-mutants-${{ runner.os }}-27.1.0
      # Guarded by the binary, not by `cargo install`'s own check: the cache
      # restores the binary without ~/.cargo/.crates.toml, so an unguarded
      # install rebuilds from source on every hit (fuzz-check learned this).
      - run: test -x ~/.cargo/bin/cargo-mutants || cargo install cargo-mutants --version 27.1.0 --locked
      # cache-bin: false, because this workflow already caches
      # ~/.cargo/bin/cargo-mutants itself (above): Swatinem's own bin
      # management defaults on and prunes untracked binaries from that same
      # directory in its post-job step, which runs before the plain
      # actions/cache save (post-job hooks unwind LIFO, and this step is
      # declared after it) — the binary was gone by the time the save ran,
      # so `cargo-mutants-${{ runner.os }}-27.1.0` never landed and every
      # PR run rebuilt it from source (~67s, observed on runs 34970585316
      # through 35443870161, 2026-09-15 through 09-19).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: mutants
          workspaces: . -> target
          cache-bin: false

      - name: Mutate the changed lines
        if: github.event_name == 'pull_request'
        timeout-minutes: 25
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git diff --merge-base "origin/$BASE_REF" HEAD -- src > pr.diff
          set +e
          cargo mutants --package mothergod --in-diff pr.diff --timeout-multiplier 10 -j 4
          status=$?
          set -e
          # 2 and 3 are outcomes cargo-mutants reports, not a broken run; the
          # verdict step below judges them from missed.txt. Exiting here on
          # either would red a PR for a timeout, which is an undecided mutant
          # and not evidence of a missing test.
          case $status in
            0 | 2 | 3) ;;
            *) echo "cargo-mutants could not complete (exit $status)"; exit 1 ;;
          esac

      - name: Mutate the whole codec
        if: github.event_name != 'pull_request'
        timeout-minutes: 330
        run: |
          set +e
          cargo mutants --package mothergod --timeout-multiplier 10 -j 4
          status=$?
          set -e
          case $status in
            0 | 2 | 3) ;;
            *) echo "cargo-mutants could not complete (exit $status)"; exit 1 ;;
          esac

      - name: Verdict
        run: |
          if [ -s mutants.out/timeout.txt ]; then
            echo "::notice::$(grep -c . mutants.out/timeout.txt) mutant(s) timed out: undecided, not counted against this diff"
          fi
          if [ ! -s mutants.out/missed.txt ]; then
            echo "No missed mutants."
            exit 0
          fi
          echo "Missed mutants. Each is a line no test distinguishes from its mutation:"
          cat mutants.out/missed.txt
          echo
          echo "Add a test that fails under the mutation, or explain on the PR why the line is not worth distinguishing."
          exit 1

      # Runs whatever the verdict, on the report as it stands: a timed-out
      # mutate step skips the verdict but still leaves a partial missed.txt
      # (#690's 50 survivors were exactly that), and a PR merged during the
      # run is the case this step exists for. Same-repo PRs only: a fork's
      # token cannot file, and its red is read on the open thread.
      - name: File the survivors of a merged PR
        if: >-
          always() && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
          GH_WORKFLOW_TOKEN: ${{ github.token }}
          ROLE: mutants-check
        run: .github/scripts/mutants-debt "$PR_NUMBER" mutants.out

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutants-report
          path: mutants.out/
          if-no-files-found: ignore
