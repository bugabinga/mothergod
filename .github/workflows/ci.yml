# Quality gate for every change. This is the ground truth all other
# automation (including agent-driven workflows) trusts: nothing merges red.
# The four job names (fmt, clippy, test, doc) are load-bearing: the main
# ruleset requires exactly these check names. Rename only together with the
# ruleset — a mismatch blocks every merge.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR or branch obsoletes the previous run's
# verdict; cancel it instead of finishing it (operator directive:
# workflows stay smart, cached and fast).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: --deny warnings

jobs:
  # Path filter (operator directive, Telegram, 2026-08-22). The four
  # required gates are cargo gates; a PR that changes no cargo input gets
  # four skips, and the ruleset counts a skipped required check as
  # satisfied. One output per toolchain, `rust` and `js`. The filter
  # enumerates tool-INPUT FILE TYPES, never tree paths: globs like *.rs and
  # Cargo.toml stay correct when directories move, so the list drifts only
  # when the toolchain itself changes. Sync rule: a PR that adds a new tool
  # input class (say, a Markdown formatter) extends this regex in the same
  # diff that adds the tool, ten lines away. Non-PR events always run
  # everything, so main's green is never vacuous.
  #
  # Fail-safe by inversion (review on #79, two rounds): the gates skip
  # only when this job POSITIVELY outputs rust=false. Any other upstream
  # conclusion (failure, timeout-as-cancelled, skip) leaves the output
  # empty, the gates' `!= 'false'` condition holds, and they run.
  # `always()` and not `!cancelled()` on the gates: a timed-out needs job
  # concludes "cancelled", and whether job-level `cancelled()` reads the
  # run or the needs job is ambiguous in the docs, so the primitive that
  # runs under every upstream conclusion is the only unambiguous one.
  # Accepted trade: a concurrency-cancelled run's gates still finish,
  # costing seconds of runner time. A broken filter costs runner
  # minutes, never a vacuous green.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      js: ${{ steps.filter.outputs.js }}
    steps:
      - name: Detect tool-input changes
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "js=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)')"
          if echo "$files" | grep -qE '\.rs$|(^|/)Cargo\.(toml|lock)$|^rust-toolchain|^\.cargo/|^rustfmt\.toml$|^clippy\.toml$|^\.github/workflows/ci\.yml$|^\.github/actions/rust-ci/'; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$files" | grep -qE '\.[cm]?js$|^\.github/actions/agent-audit/action\.yml$|^\.github/workflows/ci\.yml$'; then
            echo "js=true" >> "$GITHUB_OUTPUT"
          else
            echo "js=false" >> "$GITHUB_OUTPUT"
          fi

  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: changes
    if: ${{ always() && needs.changes.outputs.rust != 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/rust-ci
        with:
          checks: fmt
          cache: 'false'

  clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: changes
    if: ${{ always() && needs.changes.outputs.rust != 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/rust-ci
        with:
          checks: clippy

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: changes
    if: ${{ always() && needs.changes.outputs.rust != 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/rust-ci
        with:
          checks: test

  doc:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: changes
    if: ${{ always() && needs.changes.outputs.rust != 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/rust-ci
        with:
          checks: doc

  # The Telegram worker is the one piece of logic here that cannot be Rust:
  # it runs on Cloudflare's edge (ADR-0006 covers what produces published
  # numbers; this produces none). Its typing state machine cost three
  # rounds of hand-tracing in PR #155 review, so it has tests, and tests
  # nobody runs are decoration. The same dependency-free Node runner exercises
  # agent-audit's allowance index against its real extraction block. Not a
  # required check: it gates nothing on a red day for the crate, and the
  # ruleset's four names stay exactly as they are.
  worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: changes
    if: ${{ always() && needs.changes.outputs.js != 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: node --test infra/telegram-worker/*.test.mjs
      - run: node --test .github/actions/agent-audit/*.test.mjs .github/scripts/*.test.mjs

  # ADRs are numbered by listing the directory at branch-cut time (#195):
  # two PRs open at once can pick the same number and neither CI job
  # notices, because nothing else reads the whole directory at once. Not
  # a required check (the ruleset's four names stay exactly as they are);
  # it still turns a silent collision into a red run on every PR.
  adr-numbers:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: |
          dupes="$(ls docs/adr | grep -oE '^[0-9]{4}' | sort | uniq -d)"
          if [ -n "$dupes" ]; then
            echo "Duplicate ADR number(s), rename one: $dupes"
            exit 1
          fi

  # agent-bdfl.yml carries its wake predicate twice (concurrency.group and
  # jobs.bdfl.if) because GitHub gives no way to single-source it (issue
  # #145). Not a required check; a few seconds on every PR either way, so
  # no path filter needed.
  bdfl-wake-predicate:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: pip install --quiet pyyaml
      - run: python3 .github/scripts/check-bdfl-wake-predicate.py
