# Quality gate for every change. This is the ground truth all other
# automation (including agent-driven workflows) trusts: nothing merges red.
# The required job names (fmt, clippy, test, doc, ratio, worker, em-dash) are
# load-bearing: the main ruleset requires exactly these check names. Rename
# only together with the ruleset: a mismatch blocks every merge.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR or branch obsoletes the previous run's
# verdict; cancel it instead of finishing it, because a minute spent on
# an obsolete verdict is operator subscription and contributor wait.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: --deny warnings

jobs:
  # Path filter: a PR that changes no gate input gets skips, and the
  # ruleset counts a skipped required check as satisfied, so a docs PR
  # costs no crate build. Outputs describe x quality inputs, Rust
  # build inputs, and the ratio gate's. The filter enumerates tool-input
  # file types, never tree paths: globs like *.rs and Cargo.toml stay correct
  # when directories move, so the list drifts only when a toolchain changes.
  # Sync rule: a new x input class extends the quality regex in the same diff.
  # The one path list is the test suite's own inputs: everything under
  # tests/ (adversarial seeds carry no extension), fuzz/fuzz_targets/, and
  # the published surface tests/claims.rs reads, declared there as `INPUTS`
  # and held to the rust regex by .github/scripts/ci-filter.test.mjs
  # (#1009: before it a file claims.rs started reading joined the regex by
  # discipline alone, and LICENSE missed, #1215). Without them a site-only
  # PR skipped the one suite that checks the site, and the reviewer ran it
  # by hand (#1007, both rounds). A miss turns main red on the next push,
  # where everything runs.
  # Non-PR events always run everything, so main's green is never vacuous.
  #
  # Fail-safe by inversion (review on #79, two rounds): each gate skips
  # only when this job POSITIVELY marks its input class false. Any other
  # upstream conclusion (failure, timeout-as-cancelled, skip) leaves the
  # output empty, the gate's `!= 'false'` condition holds, and it runs.
  # `always()` and not `!cancelled()` on the gates: a timed-out needs job
  # concludes "cancelled", and whether job-level `cancelled()` reads the
  # run or the needs job is ambiguous in the docs, so the primitive that
  # runs under every upstream conclusion is the only unambiguous one.
  # Accepted trade: a concurrency-cancelled run's gates still finish,
  # costing seconds of runner time. A broken filter costs runner
  # minutes, never a vacuous green.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      pull-requests: read
    outputs:
      quality: ${{ steps.filter.outputs.quality }}
      rust: ${{ steps.filter.outputs.rust }}
      ratio: ${{ steps.filter.outputs.ratio }}
    steps:
      - name: Detect tool-input changes
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            {
              echo "quality=true"
              echo "rust=true"
              echo "ratio=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)')"
          if echo "$files" | grep -qE '\.(rs|md|markdown|json|jsonl|toml|ya?ml|[cm]?js|[cm]?ts|html|svg)$|(^|/)Cargo\.lock$|^rust-toolchain|^\.cargo/|^rustfmt\.toml$|^clippy\.toml$|^\.github/workflows/ci\.yml$|^\.github/actions/rust-ci/'; then
            echo "quality=true" >> "$GITHUB_OUTPUT"
          else
            echo "quality=false" >> "$GITHUB_OUTPUT"
          fi
          # .mgdc/.plaintext: golden fixture pairs, discovered by extension
          # scan in tests/golden.rs, so the test binary is their only
          # consumer; they gate `rust` (test/doc), not quality/ratio (#407).
          # ROADMAP.md, research/JOURNAL.md: tests/claims.rs reads them for
          # the M3 lead-id check (#1583); a read input this filter misses
          # passes every PR and fails on main's next push (#1009).
          if echo "$files" | grep -qE '\.(rs|mgdc|plaintext)$|(^|/)Cargo\.(toml|lock)$|^rust-toolchain|^\.cargo/|^rustfmt\.toml$|^clippy\.toml$|^\.github/workflows/ci\.yml$|^\.github/actions/rust-ci/|^tests/|^(README|CHANGELOG|CLAUDE)\.md$|^LICENSE$|^site/|^docs/benchmarks/|^bench/corpus\.toml$|^research/progress\.jsonl$|^fuzz/fuzz_targets/|^ROADMAP\.md$|^research/JOURNAL\.md$'; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$files" | grep -qE '\.rs$|(^|/)Cargo\.(toml|lock)$|(^|/)baseline\.json$|^rust-toolchain|^\.cargo/|^\.github/workflows/ci\.yml$|^\.github/actions/rust-ci/'; then
            echo "ratio=true" >> "$GITHUB_OUTPUT"
          else
            echo "ratio=false" >> "$GITHUB_OUTPUT"
          fi

  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: changes
    if: ${{ always() && needs.changes.outputs.quality != 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/rust-ci
        with:
          checks: fmt
          cache: "false"

  clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: changes
    if: ${{ always() && needs.changes.outputs.quality != 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/rust-ci
        with:
          checks: clippy

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: changes
    if: ${{ always() && needs.changes.outputs.rust != 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/rust-ci
        with:
          checks: test

  doc:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: changes
    if: ${{ always() && needs.changes.outputs.rust != 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/rust-ci
        with:
          checks: doc

  # Ratio regression gate (docs/TESTING.md layer 7, JOURNAL S2-D1, #284):
  # a PR fails when measured bits/byte on the fixed gate cases regresses
  # past `baseline::TOLERANCE_BITS` vs the committed `bench/baseline.json`,
  # or when any case compresses to different bytes than the digest that
  # file commits, equal size included (#1254). Fixed seeds through a
  # deterministic codec: a red here is a real ratio regression or a real
  # output change, never noise. Runs the gate binary directly, not through
  # x: the ratio gate is not a stage of x's quality gate (ADR-0029), and
  # its own error output teaches each accepted path: a regression is a
  # hand edit of `bench/baseline.json` (`-- write` holds a grown case,
  # #1230); an intended output change is `-- write`, which regenerates
  # the digests.
  ratio:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: changes
    if: ${{ always() && needs.changes.outputs.ratio != 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/rust-ci
        with:
          checks: setup
      - run: cargo run -p mothergod-bench --release --bin baseline_gate -- check

  # The crate ships what Cargo.toml's `include` allowlist names, and
  # `cargo package` verifies only that the library compiles from it, so a
  # packaged test that reads a path outside the allowlist (the tree has
  # docs/ and site/, the crate does not) passes `test` above and fails for
  # whoever runs the published crate's tests, where nothing can be fixed
  # because a published version cannot be deleted (#1025; #1023 ran the
  # shipped tests once, by hand). This runs them from the tarball on every
  # change to the `rust` class, which holds every packaged path. Not a
  # required check yet: a gate goes into the ruleset after it has reported
  # on real PRs, the way worker did on 2026-10-09, and until then a red
  # here is the reviewer's to read like adr-numbers below.
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: changes
    if: ${{ always() && needs.changes.outputs.rust != 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/rust-ci
        with:
          checks: setup
      - run: .github/scripts/package-test

  # The Telegram worker is the one piece of logic here that cannot be Rust:
  # it runs on Cloudflare's edge (ADR-0006 covers what produces published
  # numbers; this produces none). Its typing state machine cost three
  # rounds of hand-tracing in PR #155 review, so it has tests, and tests
  # nobody runs are decoration. The same dependency-free Node runner exercises
  # agent-audit's extraction script and retrospect's budget footer, both
  # importing the shared allowance parse (issue #310). No path filter, on
  # purpose: these tests read across the tree, and the filter that listed
  # their inputs grew twice (.github/scripts/ for retrospect, extensionless
  # and invisible to a suffix match, #310; .github/workflows/ and
  # agents/personas/ for gh-comment's test, #505) and still missed
  # status-data's test, which reads ROADMAP.md, src/lib.rs, bench/, docs/
  # and tests/fit/: #1451, a roadmap-only PR, skipped this job and turned
  # main red on merge. The job takes about a minute beside clippy's ten,
  # so running it on every PR costs less than the next missed input.
  # A required check since 2026-10-09: it holds the prompt pins
  # (prompt-bytes), and #957 landed red here because merge-pr reads the
  # ruleset alone and a workflow PR gets no reviewer (#114).
  worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # HEAD^1 is the PR's base on a pull_request checkout; envelope-diff
          # below reads both sides of every changed workflow from it.
          fetch-depth: 2
      - run: node --test infra/telegram-worker/*.test.mjs
      - run: node --test .github/actions/agent-audit/*.test.mjs .github/scripts/*.test.mjs
      # ADR-0008 as a check (#1042): a permission envelope (a `permissions`
      # scope, --max-turns, --tools, --allowedTools, --permission-mode) moved
      # by a branch that is not the BDFL's, nor the operator's own PR, is
      # red here, a required job; the reviewer's prompt points at this step.
      # pull_request only: a push to main is a merge whose PR already ran
      # it, and carries no author to judge.
      - if: github.event_name == 'pull_request'
        env:
          BRANCH: ${{ github.head_ref }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: .github/scripts/envelope-diff HEAD^1 HEAD --branch "$BRANCH" --author "$AUTHOR"

  # ADRs are numbered by listing the directory at branch-cut time (#195):
  # two PRs open at once can pick the same number and neither CI job
  # notices, because nothing else reads the whole directory at once. Not
  # a required check; it still turns a silent collision into a red run on
  # every PR.
  adr-numbers:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: |
          dupes="$(basename -a docs/adr/* | grep -oE '^[0-9]{4}' | sort | uniq -d)"
          if [ -n "$dupes" ]; then
            echo "Duplicate ADR number(s), rename one: $dupes"
            exit 1
          fi

  # CLAUDE.md's Voice forbids the em dash in every posted text, and the
  # deny-em-dash hook holds it where text leaves a session: as a Bash
  # argument, and since #774 as an Edit or Write to a prose file. A human's
  # push has no hook, so this is the gate: the lines a change adds to a
  # prose file (prose.py's suffixes) are read, and one carrying U+2014 is
  # red with its path and line. Diff-scoped because about 800 lines of the
  # tree carry the character; a whole-file rule starts with a rewrite
  # nobody asked for, and this holds the line from the day it lands.
  # fetch-depth 2 brings HEAD's parents: on a pull_request HEAD is the
  # merge of the PR into its base and HEAD^1 the base, on a push HEAD^1
  # the previous tip, so the diff is what the change adds in either case.
  # A required check, because the reviewer reads a non-required red as
  # "unverified" and may still pass the PR; seconds on every PR, so no
  # path filter.
  em-dash:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - run: |
          set -euo pipefail
          git diff --unified=0 HEAD^1 HEAD | .github/scripts/em-dash-diff

  # The workflow YAML is the agent system itself, and until 2026-10-25
  # nothing read it but a reviewer (#556). actionlint checks every file
  # under .github/workflows/, shellcheck over each `run:` body included;
  # a release binary pinned by checksum, because it runs on every PR and
  # a tag is a pointer. One message is ignored by name: actionlint 1.7.12
  # does not know the `vulnerability-alerts` permission scope, and GitHub
  # grants it (`.github/scripts/security-alerts` reads Dependabot alerts
  # on the job token with it and the session token without it gets 403,
  # measured 2026-10-25). The `${{ }}`-inside-`run:` rule is `cargo x
  # lint`'s, in the clippy job above, where it is red one turn after the
  # edit. The second step is the one check actionlint cannot express:
  # agent-bdfl.yml carries its wake predicate twice (concurrency.group and
  # jobs.bdfl.if) because GitHub gives no way to single-source it (issue
  # #145). Not a required check; seconds on every PR either way, so no
  # path filter.
  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/actionlint"
          mkdir -p "$dir"
          curl -sSfL -o "$dir/actionlint.tar.gz" "https://github.com/rhysd/actionlint/releases/download/v$VERSION/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "$SHA256  $dir/actionlint.tar.gz" | sha256sum --check --quiet
          tar -xzf "$dir/actionlint.tar.gz" -C "$dir" actionlint
          "$dir/actionlint" -no-color -ignore 'unknown permission scope "vulnerability-alerts"'
      - run: pip install --quiet pyyaml
      - run: python3 .github/scripts/check-bdfl-wake-predicate.py
