# Quality gate for every change. This is the ground truth all other
# automation (including agent-driven workflows) trusts: nothing merges red.
# The required job names (fmt, clippy, test, doc, ratio) are load-bearing:
# the main ruleset requires exactly these check names. Rename only together
# with the ruleset — a mismatch blocks every merge.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR or branch obsoletes the previous run's
# verdict; cancel it instead of finishing it (operator directive:
# workflows stay smart, cached and fast).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: --deny warnings

jobs:
  # Path filter (operator directive, Telegram, 2026-08-22). A PR that
  # changes no gate input gets skips, and the ruleset counts a skipped
  # required check as satisfied. Outputs describe x quality inputs, Rust
  # build inputs, and JavaScript tests. The filter enumerates tool-input
  # file types, never tree paths: globs like *.rs and Cargo.toml stay correct
  # when directories move, so the list drifts only when a toolchain changes.
  # Sync rule: a new x input class extends the quality regex in the same diff.
  # Non-PR events always run everything, so main's green is never vacuous.
  #
  # Fail-safe by inversion (review on #79, two rounds): each gate skips
  # only when this job POSITIVELY marks its input class false. Any other
  # upstream conclusion (failure, timeout-as-cancelled, skip) leaves the
  # output empty, the gate's `!= 'false'` condition holds, and it runs.
  # `always()` and not `!cancelled()` on the gates: a timed-out needs job
  # concludes "cancelled", and whether job-level `cancelled()` reads the
  # run or the needs job is ambiguous in the docs, so the primitive that
  # runs under every upstream conclusion is the only unambiguous one.
  # Accepted trade: a concurrency-cancelled run's gates still finish,
  # costing seconds of runner time. A broken filter costs runner
  # minutes, never a vacuous green.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      pull-requests: read
    outputs:
      quality: ${{ steps.filter.outputs.quality }}
      rust: ${{ steps.filter.outputs.rust }}
      js: ${{ steps.filter.outputs.js }}
      ratio: ${{ steps.filter.outputs.ratio }}
    steps:
      - name: Detect tool-input changes
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "quality=true" >> "$GITHUB_OUTPUT"
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "js=true" >> "$GITHUB_OUTPUT"
            echo "ratio=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)')"
          if echo "$files" | grep -qE '\.(rs|md|markdown|json|jsonl|toml|ya?ml|[cm]?js|[cm]?ts|html|svg)$|(^|/)Cargo\.lock$|^rust-toolchain|^\.cargo/|^rustfmt\.toml$|^clippy\.toml$|^\.github/workflows/ci\.yml$|^\.github/actions/rust-ci/'; then
            echo "quality=true" >> "$GITHUB_OUTPUT"
          else
            echo "quality=false" >> "$GITHUB_OUTPUT"
          fi
          # .mgdc/.plaintext: golden fixture pairs, discovered by extension
          # scan in tests/golden.rs, so the test binary is their only
          # consumer; they gate `rust` (test/doc), not quality/ratio (#407).
          if echo "$files" | grep -qE '\.(rs|mgdc|plaintext)$|(^|/)Cargo\.(toml|lock)$|^rust-toolchain|^\.cargo/|^rustfmt\.toml$|^clippy\.toml$|^\.github/workflows/ci\.yml$|^\.github/actions/rust-ci/'; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$files" | grep -qE '\.[cm]?js$|^\.github/(scripts|actions/agent-audit|workflows)/|^agents/personas/'; then
            echo "js=true" >> "$GITHUB_OUTPUT"
          else
            echo "js=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$files" | grep -qE '\.rs$|(^|/)Cargo\.(toml|lock)$|(^|/)baseline\.json$|^rust-toolchain|^\.cargo/|^\.github/workflows/ci\.yml$|^\.github/actions/rust-ci/'; then
            echo "ratio=true" >> "$GITHUB_OUTPUT"
          else
            echo "ratio=false" >> "$GITHUB_OUTPUT"
          fi

  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: changes
    if: ${{ always() && needs.changes.outputs.quality != 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/rust-ci
        with:
          checks: fmt
          cache: "false"

  clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: changes
    if: ${{ always() && needs.changes.outputs.quality != 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/rust-ci
        with:
          checks: clippy

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: changes
    if: ${{ always() && needs.changes.outputs.rust != 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/rust-ci
        with:
          checks: test

  doc:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: changes
    if: ${{ always() && needs.changes.outputs.rust != 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/rust-ci
        with:
          checks: doc

  # Ratio regression gate (docs/TESTING.md layer 7, JOURNAL S2-D1, #284):
  # a PR fails when measured bits/byte on the fixed gate cases regresses
  # past `baseline::TOLERANCE_BITS` vs the committed `bench/baseline.json`.
  # Fixed seeds through a deterministic codec: a red here is a real ratio
  # regression, never noise. Runs the gate binary directly, not through x:
  # the ratio gate is not a stage of x's quality gate (ADR-0029), and its
  # own error output teaches the accepted-trade path (`-- write`).
  ratio:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: changes
    if: ${{ always() && needs.changes.outputs.ratio != 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/rust-ci
        with:
          checks: setup
      - run: cargo run -p mothergod-bench --release --bin baseline_gate -- check

  # The Telegram worker is the one piece of logic here that cannot be Rust:
  # it runs on Cloudflare's edge (ADR-0006 covers what produces published
  # numbers; this produces none). Its typing state machine cost three
  # rounds of hand-tracing in PR #155 review, so it has tests, and tests
  # nobody runs are decoration. The same dependency-free Node runner exercises
  # agent-audit's extraction script and retrospect's budget footer, both
  # importing the shared allowance parse (issue #310); the js filter above
  # watches all of .github/scripts/ because those files, retrospect included
  # (extensionless, invisible to a suffix match), are what these tests read.
  # It watches .github/workflows/ and agents/personas/ for the same reason
  # (issue #505): gh-comment's test reads every workflow's env block and takes
  # the seat names from the persona files, so a PR adding seat seven is
  # precisely the one that must run this job, and it touches no script.
  # Not a required check: it gates nothing on a red day for the crate, and
  # the ruleset's required names stay exactly as they are.
  worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: changes
    if: ${{ always() && needs.changes.outputs.js != 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: node --test infra/telegram-worker/*.test.mjs
      - run: node --test .github/actions/agent-audit/*.test.mjs .github/scripts/*.test.mjs

  # ADRs are numbered by listing the directory at branch-cut time (#195):
  # two PRs open at once can pick the same number and neither CI job
  # notices, because nothing else reads the whole directory at once. Not
  # a required check (the ruleset's required names stay exactly as they
  # are); it still turns a silent collision into a red run on every PR.
  adr-numbers:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: |
          dupes="$(ls docs/adr | grep -oE '^[0-9]{4}' | sort | uniq -d)"
          if [ -n "$dupes" ]; then
            echo "Duplicate ADR number(s), rename one: $dupes"
            exit 1
          fi

  # agent-bdfl.yml carries its wake predicate twice (concurrency.group and
  # jobs.bdfl.if) because GitHub gives no way to single-source it (issue
  # #145). Not a required check; a few seconds on every PR either way, so
  # no path filter needed.
  bdfl-wake-predicate:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: pip install --quiet pyyaml
      - run: python3 .github/scripts/check-bdfl-wake-predicate.py
