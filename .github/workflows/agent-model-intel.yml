# Model intelligence watch. Deliberately NOT an agent: no Claude step, no
# tokens, no context window (ADR-0019). The `agent-` prefix is inaccurate
# and kept anyway: renaming splits the run history and touches four call
# sites to buy nothing (ADR-0022).
#
# Two collectors, one assembly, one channel (ADR-0022). Capability comes
# from Artificial Analysis: what the market thinks a model can do. Run
# economics comes from our own audit artifacts: what our roles actually
# cost on the workload we actually run. ADR-0012 (model) and ADR-0021
# (effort) need both, and joining them by hand every time is the thing
# this avoids. The two never depend on each other: either half failing
# still ships the other.
#
# Filtering an API response is arithmetic, and a script does it
# deterministically and for free. It also cannot be talked into anything:
# Artificial Analysis' JSON is third-party data, and a fixed-schema
# extractor pulling named numeric fields has no injection surface that an
# agent reading the raw payload would have.
#
# Output is delta-only (ADR-0007 run economy). Nothing changed, nothing
# posted. When something ladder-relevant moves it opens or updates ONE
# issue labeled model-intel, which the BDFL picks up through the issue
# triage it already performs every run. That is the whole point: a file
# committed to the repo would never be read, because nothing in the BDFL's
# prompt would tell it to, and agents/PERSONALITY.md already records that
# a pointer to a file demonstrably does not shape behavior.
#
# The judgement stays the BDFL's (ADR-0012). This job puts evidence on the
# table and never edits agents/models.json itself.
name: agent-model-intel

on:
  schedule:
    # Sundays 05:07 UTC, ahead of the BDFL's Sunday deep survey so the
    # issue is already waiting when it runs.
    - cron: '7 5 * * 0'
  workflow_dispatch:

permissions: {}

concurrency:
  group: agent-model-intel
  cancel-in-progress: false

jobs:
  intel:
    runs-on: ubuntu-latest
    # Headroom for the telemetry collector, which downloads one small zip
    # per audit artifact in its two windows: 129 artifacts took 56 seconds
    # on 2026-08-23, and its own cap allows 600.
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      # Listing and downloading this repo's own audit artifacts.
      actions: read
    steps:
      - uses: actions/checkout@v7

      - id: guard
        uses: ./.github/actions/agent-guard
        with:
          token: ${{ github.token }}

      - id: fetch
        if: steps.guard.outputs.paused != 'true'
        shell: bash
        env:
          AA_TOKEN: ${{ secrets.ARTIFICIALANALYSIS_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${AA_TOKEN:-}" ]; then
            echo "No ARTIFICIALANALYSIS_API_TOKEN configured; nothing to fetch."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Token stays in the variable and out of the echoed command
          # (CLAUDE.md hard rule 10). The raw response is written to the
          # runner temp dir, never into the repo.
          code="$(curl -sS -o "$RUNNER_TEMP/aa.json" -w '%{http_code}' \
            -H "x-api-key: $AA_TOKEN" \
            'https://artificialanalysis.ai/api/v2/language/models/free' || echo 000)"
          if [ "$code" != 200 ]; then
            echo "Artificial Analysis returned HTTP $code; skipping this run."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Fetched $(wc -c < "$RUNNER_TEMP/aa.json") bytes."
          echo "ok=true" >> "$GITHUB_OUTPUT"

      # The second collector (ADR-0022). Independent of the first by
      # design: it reads our own audit artifacts, so it still reports when
      # Artificial Analysis is down or unconfigured.
      - id: telemetry
        if: steps.guard.outputs.paused != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          python3 .github/scripts/run-telemetry.py "$RUNNER_TEMP/out/telemetry.md" 7

      - id: report
        if: steps.guard.outputs.paused != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/out"
          mkdir -p "$out"
          # Any state, not just open (BDFL ruling on PR #112). A closed
          # model-intel issue means the BDFL already ruled on that delta;
          # reopening the same fingerprint next Sunday re-asks an answered
          # question forever. New evidence still fires, because new
          # evidence is a new fingerprint.
          prior="$(gh issue list --repo "$GITHUB_REPOSITORY" --label model-intel --state all --json number,state,body --limit 1)"
          verdict=unchanged
          if [ "${{ steps.fetch.outputs.ok }}" = true ]; then
            PRIOR="$prior" python3 .github/scripts/model-intel.py "$RUNNER_TEMP/aa.json" "$out"
            verdict="$(cat "$out/verdict")"
          else
            printf '# Model capability: no report\n\nNo usable Artificial Analysis snapshot this run.\n' > "$out/issue.md"
          fi
          echo "verdict: $verdict"

          # One assembly step, because the decision needs both halves side
          # by side (operator, issue #118). Each collector writes a section
          # and neither owns the frame, so a failure in one still ships the
          # other.
          {
            cat "$out/issue.md"
            echo
            cat "$out/telemetry.md" 2>/dev/null || echo '# Run economics'$'\n\n''The telemetry collector produced nothing this run.'
            echo
            echo '---'
            echo '_Generated by [Claude Code](https://claude.ai/code)_'
          } > "$out/body.md"
          cat "$out/body.md" >> "$GITHUB_STEP_SUMMARY"

          gh label create model-intel --repo "$GITHUB_REPOSITORY" \
            --color 1D76DB --description "Model and effort evidence for ADR-0012/0021 decisions" 2>/dev/null || true
          gh label create triage --repo "$GITHUB_REPOSITORY" --color FBCA04 2>/dev/null || true

          # State versus event (ADR-0022). Run economics is STATE: the body
          # is rewritten every week and the issue's own edit history is the
          # trend line, which is why no database was built for one. A
          # capability delta is an EVENT: it additionally comments, which
          # is the only thing that notifies. So the issue stays open and is
          # never closed by this job.
          n="$(jq -r '.[0] | select(.state == "OPEN") | .number // empty' <<<"$prior")"
          if [ -n "$n" ]; then
            gh issue edit "$n" --repo "$GITHUB_REPOSITORY" --body-file "$out/body.md"
            echo "Refreshed issue #$n."
            if [ "$verdict" = changed ]; then
              gh issue comment "$n" --repo "$GITHUB_REPOSITORY" \
                --body "A ladder-relevant capability delta appeared in this week's snapshot. The body above is current; the diff is in this issue's edit history."
            fi
            exit 0
          fi
          # No open issue. A CLOSED one was ruled on: respect that ruling
          # and stay silent unless the fingerprint says this is new
          # evidence, which is exactly the old contract.
          if [ -n "$(jq -r '.[0].number // empty' <<<"$prior")" ] && [ "$verdict" != changed ]; then
            echo "Prior issue closed and no new capability delta; not reopening."
            exit 0
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "📊 Model intel: capability and run economics" \
            --label model-intel --label triage \
            --body-file "$out/body.md"
          echo "Opened a new model-intel issue."

      # Independent of the fetch: the telemetry half produces a report even
      # when Artificial Analysis does not.
      - if: always() && steps.guard.outputs.paused != 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: model-intel-${{ github.run_id }}
          path: ${{ runner.temp }}/out
          retention-days: 90
          if-no-files-found: ignore
