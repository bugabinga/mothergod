# Model intelligence watch. Deliberately NOT an agent: no Claude step, no
# tokens, no context window (ADR-0019).
#
# Filtering an API response is arithmetic, and a script does it
# deterministically and for free. It also cannot be talked into anything:
# Artificial Analysis' JSON is third-party data, and a fixed-schema
# extractor pulling named numeric fields has no injection surface that an
# agent reading the raw payload would have.
#
# Output is delta-only (ADR-0007 run economy). Nothing changed, nothing
# posted. When something ladder-relevant moves it opens or updates ONE
# issue labeled model-intel, which the BDFL picks up through the issue
# triage it already performs every run. That is the whole point: a file
# committed to the repo would never be read, because nothing in the BDFL's
# prompt would tell it to, and agents/PERSONALITY.md already records that
# a pointer to a file demonstrably does not shape behavior.
#
# The judgement stays the BDFL's (ADR-0012). This job puts evidence on the
# table and never edits agents/models.json itself.
name: agent-model-intel

on:
  schedule:
    # Sundays 05:07 UTC, ahead of the BDFL's Sunday deep survey so the
    # issue is already waiting when it runs.
    - cron: '7 5 * * 0'
  workflow_dispatch:

permissions: {}

concurrency:
  group: agent-model-intel
  cancel-in-progress: false

jobs:
  intel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - id: guard
        uses: ./.github/actions/agent-guard
        with:
          token: ${{ github.token }}

      - id: fetch
        if: steps.guard.outputs.paused != 'true'
        shell: bash
        env:
          AA_TOKEN: ${{ secrets.ARTIFICIALANALYSIS_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${AA_TOKEN:-}" ]; then
            echo "No ARTIFICIALANALYSIS_API_TOKEN configured; nothing to fetch."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Token stays in the variable and out of the echoed command
          # (CLAUDE.md hard rule 10). The raw response is written to the
          # runner temp dir, never into the repo.
          code="$(curl -sS -o "$RUNNER_TEMP/aa.json" -w '%{http_code}' \
            -H "x-api-key: $AA_TOKEN" \
            'https://artificialanalysis.ai/api/v2/language/models/free' || echo 000)"
          if [ "$code" != 200 ]; then
            echo "Artificial Analysis returned HTTP $code; skipping this run."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Fetched $(wc -c < "$RUNNER_TEMP/aa.json") bytes."
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - id: report
        if: steps.guard.outputs.paused != 'true' && steps.fetch.outputs.ok == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prior="$(gh issue list --repo "$GITHUB_REPOSITORY" --label model-intel --state open --json number,body --limit 1)"
          PRIOR="$prior" python3 - "$RUNNER_TEMP/aa.json" "$RUNNER_TEMP/out" <<'PY'
          import hashlib, json, os, re, sys

          raw_path, out_dir = sys.argv[1], sys.argv[2]
          os.makedirs(out_dir, exist_ok=True)

          def write(name, text):
              with open(os.path.join(out_dir, name), "w", encoding="utf-8") as fh:
                  fh.write(text)

          def bail(reason, detail=""):
              # Self-diagnosis over silence: an unexpected payload shape reports what
              # it actually saw instead of posting a garbage issue or failing the run.
              body = f"# Model intel: no report\n\n{reason}\n\n{detail}\n"
              write("summary.md", body)
              write("issue.md", body)
              write("verdict", "unchanged")
              sys.exit(0)

          try:
              payload = json.load(open(raw_path, encoding="utf-8"))
          except (OSError, ValueError) as exc:
              bail(f"Response was not readable JSON ({exc}).")

          # The response envelope is not pinned by the docs, so find the model list
          # rather than assume a key.
          rows = None
          if isinstance(payload, list):
              rows = payload
          elif isinstance(payload, dict):
              for key in ("data", "models", "results", "items"):
                  if isinstance(payload.get(key), list):
                      rows = payload[key]
                      break
          if not rows:
              keys = ", ".join(sorted(payload)) if isinstance(payload, dict) else type(payload).__name__
              bail("Could not locate the model list in the response.",
                   f"Top-level keys seen: `{keys}`. Adjust the extractor to match.")

          INDEX = "artificial_analysis_intelligence_index"

          def ident(row):
              for k in ("slug", "id", "model_slug", "name", "model"):
                  v = row.get(k)
                  if isinstance(v, str) and v:
                      return v
              return ""

          def score(row):
              v = row.get(INDEX)
              return float(v) if isinstance(v, (int, float)) else None

          models = []
          for row in rows:
              if not isinstance(row, dict):
                  continue
              name, s = ident(row), score(row)
              if name and s is not None:
                  models.append({"id": name, "score": s,
                                 "coding": row.get("artificial_analysis_coding_index"),
                                 "agentic": row.get("artificial_analysis_agentic_index")})
          if not models:
              sample = rows[0] if isinstance(rows[0], dict) else {}
              bail(f"No entry carried both an identifier and `{INDEX}`.",
                   f"Keys on the first entry: `{', '.join(sorted(sample)) or 'none'}`.")

          models.sort(key=lambda m: -m["score"])

          try:
              ladders = json.load(open("agents/models.json"))["ladders"]
          except (OSError, ValueError, KeyError) as exc:
              bail(f"agents/models.json unreadable ({exc}).")

          def norm(s):
              return re.sub(r"[^a-z0-9]", "", s.lower())

          def match(rung):
              # Our ids are Anthropic's; theirs are their own slugs. Match on
              # normalized containment either way, and report what resolved so a
              # human can confirm the mapping before anything depends on it.
              n = norm(rung)
              for m in models:
                  mn = norm(m["id"])
                  if n == mn or n in mn or mn in n:
                      return m
              return None

          findings, mapping = [], []
          for role, ladder in sorted(ladders.items()):
              if not ladder:
                  continue
              top = ladder[0]
              hit = match(top)
              mapping.append((role, top, hit["id"] if hit else None, hit["score"] if hit else None))
              if not hit:
                  continue
              on_ladder = {norm(r) for r in ladder}
              better = [m for m in models
                        if m["score"] > hit["score"]
                        and not any(norm(m["id"]) == r or r in norm(m["id"]) for r in on_ladder)]
              for m in better:
                  findings.append((role, top, hit["score"], m["id"], m["score"]))

          fingerprint = hashlib.sha256(
              json.dumps(sorted((f[0], f[3], f[4]) for f in findings)).encode()
          ).hexdigest()[:16]

          prior = os.environ.get("PRIOR", "")
          seen = re.search(r"<!-- fingerprint: ([0-9a-f]+) -->", prior)
          unchanged = bool(seen) and seen.group(1) == fingerprint

          lines = ["# Model capability snapshot", ""]
          lines.append("Source: [Artificial Analysis](https://artificialanalysis.ai/). "
                       "Attribution is required on every tier of their API, including free.")
          lines.append("")
          lines.append("## Ladder top rungs, as resolved against their catalogue")
          lines.append("")
          lines.append("| Role | Our top rung | Matched their entry | Intelligence |")
          lines.append("|---|---|---|---|")
          for role, top, hit_id, hit_score in mapping:
              lines.append(f"| {role} | `{top}` | {f'`{hit_id}`' if hit_id else '**no match**'} "
                           f"| {hit_score if hit_score is not None else 'n/a'} |")
          lines.append("")
          if any(h is None for _, _, h, _ in mapping):
              lines.append("A rung showing **no match** is far more likely a naming mismatch between "
                           "their slugs and ours than a retired model. Confirm the mapping before "
                           "reading anything into it; this job never treats a miss as a retirement.")
              lines.append("")
          if findings:
              lines.append("## Scoring above a ladder top rung, and not on that ladder")
              lines.append("")
              lines.append("| Role | Beats | Their score | Candidate | Its score |")
              lines.append("|---|---|---|---|---|")
              for role, top, ts, cand, cs in findings:
                  lines.append(f"| {role} | `{top}` | {ts} | `{cand}` | {cs} |")
              lines.append("")
              lines.append("This is evidence, not a decision. Whether a ladder changes is the BDFL's "
                           "call (ADR-0012), including whether this project can even reach these "
                           "models on its subscription, which their index does not know.")
          else:
              lines.append("No model outside a ladder scores above that ladder's top rung.")
          lines.append("")
          lines.append("## Top 10 by intelligence index")
          lines.append("")
          lines.append("| Model | Intelligence | Coding | Agentic |")
          lines.append("|---|---|---|---|")
          for m in models[:10]:
              lines.append(f"| `{m['id']}` | {m['score']} | {m['coding'] if m['coding'] is not None else '-'} "
                           f"| {m['agentic'] if m['agentic'] is not None else '-'} |")
          lines.append("")
          lines.append(f"{len(models)} models carried an intelligence index in this snapshot.")
          lines.append("")
          lines.append(f"<!-- fingerprint: {fingerprint} -->")
          lines.append("")
          lines.append("---")
          lines.append("_Generated by [Claude Code](https://claude.ai/code)_")

          body = "\n".join(lines)
          write("issue.md", body)
          write("summary.md", body)
          write("verdict", "unchanged" if (unchanged or not findings) else "changed")
          print(f"models={len(models)} findings={len(findings)} fingerprint={fingerprint} "
                f"unchanged={unchanged}")
          PY
          cat "$RUNNER_TEMP/out/summary.md" >> "$GITHUB_STEP_SUMMARY"
          verdict="$(cat "$RUNNER_TEMP/out/verdict")"
          echo "verdict: $verdict"
          if [ "$verdict" != changed ]; then
            echo "No ladder-relevant delta; not posting."
            exit 0
          fi
          gh label create model-intel --repo "$GITHUB_REPOSITORY" \
            --color 1D76DB --description "Model capability data for ADR-0012 ladder decisions" 2>/dev/null || true
          gh label create triage --repo "$GITHUB_REPOSITORY" --color FBCA04 2>/dev/null || true
          n="$(jq -r '.[0].number // empty' <<<"$prior")"
          if [ -n "$n" ]; then
            gh issue edit "$n" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/out/issue.md"
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" \
              --body "Refreshed from a new Artificial Analysis snapshot. Body above is current; see the diff in this issue's edit history."
            echo "Updated issue #$n."
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "📊 Model capability: ladder review suggested" \
              --label model-intel --label triage \
              --body-file "$RUNNER_TEMP/out/issue.md"
            echo "Opened a new model-intel issue."
          fi

      - if: always() && steps.fetch.outputs.ok == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: model-intel-${{ github.run_id }}
          path: ${{ runner.temp }}/out
          retention-days: 90
          if-no-files-found: ignore
