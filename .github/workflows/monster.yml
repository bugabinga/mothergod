# Advisory depth sweep. Pull requests never trigger this workflow, and it is
# not a required check, so nothing here can deadlock a merge.
name: monster

on:
  schedule:
    # Saturday 03:17 UTC avoids the Sunday CodeQL and agent survey window.
    # Cron-line commits must be pushed with operator/admin attribution.
    - cron: "17 3 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Serial runs prevent two failed reruns racing to create the tracking issue.
  group: monster
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: --deny warnings

jobs:
  test:
    name: ${{ matrix.os }} | ${{ matrix.architecture }} | ${{ matrix.abi }} | ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - windows-2025
          - windows-11-arm
          - macos-26-intel
          - macos-26
        surface: [native, alternate]
        toolchain: [stable, msrv]
        # Darwin exposes one supported libc ABI per host architecture. There
        # is no second executable Rust ABI to put in the alternate slots.
        exclude:
          - os: macos-26-intel
            surface: alternate
          - os: macos-26
            surface: alternate
        include:
          - os: ubuntu-24.04
            surface: native
            architecture: x64
            abi: glibc
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04
            surface: alternate
            architecture: x64
            abi: musl
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            surface: native
            architecture: ARM64
            abi: glibc
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            surface: alternate
            architecture: ARM64
            abi: musl
            target: aarch64-unknown-linux-musl
          - os: windows-2025
            surface: native
            architecture: x64
            abi: MSVC
            target: x86_64-pc-windows-msvc
          - os: windows-2025
            surface: alternate
            architecture: x64
            abi: GNU
            target: x86_64-pc-windows-gnu
          - os: windows-11-arm
            surface: native
            architecture: ARM64
            abi: MSVC
            target: aarch64-pc-windows-msvc
          - os: windows-11-arm
            surface: alternate
            architecture: ARM64
            # aarch64-pc-windows-gnu does not exist. gnullvm is Rust's
            # supported, executable GNU-family ABI for native Windows ARM64.
            abi: GNU-LLVM
            target: aarch64-pc-windows-gnullvm
          - os: macos-26-intel
            surface: native
            architecture: Intel-x64
            abi: Darwin-libc
            target: x86_64-apple-darwin
          - os: macos-26
            surface: native
            architecture: ARM64
            abi: Darwin-libc
            target: aarch64-apple-darwin
          # The canonical leg runs x's whole native gate, which takes no
          # target (ADR-0029): this three-key include overrides the triple
          # the two-key ubuntu include set above.
          - os: ubuntu-24.04
            surface: native
            toolchain: stable
            target: ""
            checks: canonical
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/rust-ci
        with:
          toolchain: ${{ matrix.toolchain }}
          target: ${{ matrix.target }}
          checks: ${{ matrix.checks || 'runtime' }}

  # Hard rule 2 re-proved under an interpreter that observes UB directly:
  # src/ is #![forbid(unsafe_code)], so this lane is insurance for the day
  # unsafe creeps in (issue #456), priced by measurement, not by the issue's
  # 10-100x planning guess. Measured 2026-09-02: Miri runs this crate's
  # arithmetic-coder loops 300-5000x slower than native, so the lane is a
  # selection, not the whole suite. In: the adversarial sweep, every hostile
  # fixture through the full decode path (~10 min), and the filter
  # transforms (~25 s), the buffer-index arithmetic half of decode. Out:
  # filters::select (prices candidates through the coder, 686 s for ONE
  # test), golden (re-encodes fixtures, one test alone breached 28 min),
  # and the rest of the unit suite (coder-loop tests cost minutes each).
  # Widening the lane means measuring first. Test-code cfg(miri) guards
  # mark only what can never run under Miri regardless of budget:
  # subprocess spawning (cli), prose checks (claims), proptest storms.
  miri:
    name: Miri | x86-64 | nightly
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Nightly grows lints ahead of stable; their churn is not this
      # lane's signal, UB is.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/rust-ci
        with:
          toolchain: nightly
          checks: setup
      - name: Install Miri
        run: rustup component add miri rust-src
      # From above the checkout, because cargo reads .cargo/config.toml
      # from the working directory up and never from the manifest's, and
      # the repository's config sets a cfg() runner (the 4 GiB cap,
      # #1683) that cargo refuses beside the cfg(all()) runner
      # cargo-miri passes on its command line. A cfg(not(miri)) guard
      # does not help, cargo never sets miri when it evaluates config;
      # a triple-keyed runner would be worse, it wins over Miri's
      # outright and runs the tests natively under a green name. Miri
      # interprets the tests inside its own process, which the cap was
      # never for.
      - name: Miri sweep
        working-directory: ${{ runner.temp }}
        env:
          # The fixture directories live on the real filesystem.
          MIRIFLAGS: -Zmiri-disable-isolation
        run: |
          cargo miri test --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" -p mothergod --test adversarial
          cargo miri test --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" -p mothergod --lib filters:: -- --skip filters::select

  x-msrv:
    name: x | MSRV
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/rust-ci
        with:
          toolchain: msrv
          checks: setup
      # setup's minimal profile lacks the two components x's gate runs,
      # Clippy under lint and rustfmt under fmt, the ones
      # rust-toolchain.toml declares for the desk; a test that runs lint
      # was red for their absence from #1647's merge to this step.
      - name: Install x's gate components
        run: rustup component add clippy rustfmt
      - run: cargo test --manifest-path x/Cargo.toml

  android:
    name: Android-15 | x86-64 | Bionic | ${{ matrix.toolchain }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, msrv]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ./.github/actions/rust-ci
        with:
          toolchain: ${{ matrix.toolchain }}
          target: x86_64-linux-android
          checks: setup
      - name: Run tests in accelerated Android
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/android-test

  # FreeBSD has no hosted runner, so this lane boots a FreeBSD guest
  # under KVM on an ubuntu runner and builds and tests inside it: the
  # one lane where the crate meets a libc that is neither glibc, musl,
  # MSVC, Darwin nor Bionic (#980). The pin covers the action's wrapper
  # only: at c46abac the guest image and anyvm.py are fetched at run
  # time by release tag from anyvm-org's GitHub releases, with no digest
  # check, so #972's rule stops at the guest boundary. Accepted because
  # nothing crosses it: the guest holds no credential (the sync copies
  # .git, so checkout persists none into it, and `envs` names three
  # variables) and writes nothing back (copyback off), so a substituted
  # image can at most misreport FreeBSD fit on an advisory lane. The cache
  # is off: one qcow2 would evict ten PR build caches from a cache at
  # its limit to save a download of under a minute.
  freebsd:
    name: FreeBSD-15 | x86-64 | libc | ${{ matrix.toolchain }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, msrv]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Resolves the version, msrv from Cargo.toml, into RUSTUP_TOOLCHAIN
      # for the guest; the host install it also does is the price of one
      # MSRV reader (docs/TESTING.md "Current automated cadence").
      - uses: ./.github/actions/rust-ci
        with:
          toolchain: ${{ matrix.toolchain }}
          checks: setup
      - name: Run tests in a FreeBSD guest
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: "15"
          envs: RUSTUP_TOOLCHAIN RUSTFLAGS CARGO_TERM_COLOR
          copyback: false
          disable-cache: true
          # rustup's own FreeBSD binary, fetched by the base system's
          # fetch(1): the guest has no curl, and the ports rust is neither
          # stable nor the MSRV.
          prepare: |
            set -eu
            fetch -o /tmp/rustup-init https://static.rust-lang.org/rustup/dist/x86_64-unknown-freebsd/rustup-init
            chmod +x /tmp/rustup-init
            /tmp/rustup-init -y --profile minimal --no-modify-path --default-toolchain "$RUSTUP_TOOLCHAIN"
          run: |
            set -eu
            export PATH="$HOME/.cargo/bin:$PATH"
            cargo test --all-targets
            cargo test --doc

  report:
    name: report
    if: ${{ always() && (needs.test.result == 'failure' || needs.test.result == 'cancelled' || needs.android.result == 'failure' || needs.android.result == 'cancelled' || needs.miri.result == 'failure' || needs.miri.result == 'cancelled' || needs.freebsd.result == 'failure' || needs.freebsd.result == 'cancelled') }}
    needs: [test, android, miri, freebsd]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build one actionable failure report
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          jobs="$RUNNER_TEMP/jobs.json"
          logs="$RUNNER_TEMP/job-logs"
          body="$RUNNER_TEMP/issue.md"
          mkdir -p "$logs"

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest&per_page=100" > "$jobs"
          failure_count="$(node .github/scripts/monster-report.mjs failures "$jobs")"
          if [ "$failure_count" -eq 0 ]; then
            echo 'No failed or timed-out matrix job; no issue update needed.'
            exit 0
          fi

          jq -r '.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out") | .id' "$jobs" |
            while read -r id; do
              if ! gh api --allow-escape-sequences "repos/$GITHUB_REPOSITORY/actions/jobs/$id/logs" > "$logs/$id.log"; then
                printf 'Failed to download completed job log %s.\n' "$id" > "$logs/$id.log"
              fi
            done

          node .github/scripts/monster-report.mjs report "$jobs" "$logs" "$RUN_URL" "$body"
          title="$(node .github/scripts/monster-report.mjs title)"
          gh issue list --repo "$GITHUB_REPOSITORY" --state all --limit 1000 \
            --json number,title,state,body,author > "$RUNNER_TEMP/issues.json"
          node .github/scripts/monster-report.mjs select "$RUNNER_TEMP/issues.json" > "$RUNNER_TEMP/selected.json"
          number="$(jq -r '.number // empty' "$RUNNER_TEMP/selected.json")"
          state="$(jq -r '.state // empty' "$RUNNER_TEMP/selected.json")"

          # `product`, on create alone: the matrix tests the crate on
          # platforms, so the usual cause is in the crate or its tests, and
          # the maintainer's bug ladder takes a product bug on its next run.
          # A runner or workflow cause is relabeled agent-system by whoever
          # reads it, and a rerun must not add the realm back (`--add-label`
          # is additive, and an issue with two realms is in two queues); the
          # old agent-system default cost #1253 a hop the other way.
          if [ -n "$number" ]; then
            if [ "$state" = CLOSED ]; then
              gh issue reopen "$number" --repo "$GITHUB_REPOSITORY"
            fi
            gh issue edit "$number" --repo "$GITHUB_REPOSITORY" \
              --title "$title" --body-file "$body" \
              --add-label bug
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$title" --body-file "$body" \
              --label bug --label product
          fi
