# Curator: daily steward of the issue tracker (ADR-0044). Triages
# every new issue to a realm and a fate, grooms open ones for
# staleness and scope, and spars with authors on substance.
# Judges and routes only: no Edit/Write, no PRs, no merges.
name: agent-curator

on:
  # Woken at 00:37 and 12:37 UTC by the worker clock (ADR-0035). The
  # cron lines in infra/telegram-worker/wrangler.toml are the cadence's
  # source of truth. Never a native `schedule:` trigger here: GitHub's
  # schedule-actor attribution breaks the app-token exchange on
  # bot-edited files (GOVERNANCE.md "Push identity").
  workflow_dispatch:
    inputs:
      source:
        description: >-
          'cron' when the worker clock's tick dispatched this run
          (ADR-0035); left at the default for a human dispatch. Only
          the clock's tick is discretionary, so only it can be skipped
          by the allowance governor (ADR-0039).
        required: false
        default: manual

permissions: {}

# Per-agent group (ADR-0014): curator runs debounce against each other
# only, never blocking another agent.
concurrency:
  group: agent-curator
  cancel-in-progress: false

jobs:
  curator:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      issues: write
      pull-requests: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - id: guard
        uses: ./.github/actions/agent-guard
        with:
          token: ${{ github.token }}
          cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          role: curator
          discretionary: ${{ inputs.source == 'cron' }}

      # The app token the session writes with dies at the hour (#81); this
      # re-mints it every 45 minutes into the file GH_TOKEN_FILE names
      # below, which gh-pr, push-branch, merge-pr and settle-push read at
      # each call (#1687; token-sidecar.py's docstring carries the why).
      # Its own session, the runner's OIDC request token on stdin and
      # scrubbed from its environment, ended by the job's orphan cleanup:
      # the seam vitals-sidecar.py cut (#1666).
      - if: steps.guard.outputs.paused != 'true'
        run: |
          printf '%s\n' "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            | env -u ACTIONS_ID_TOKEN_REQUEST_TOKEN setsid --fork \
              python3 .github/scripts/token-sidecar.py --path "$RUNNER_TEMP/app-token" \
              > "$RUNNER_TEMP/token-sidecar.log" 2>&1

      - id: claude
        if: steps.guard.outputs.paused != 'true'
        uses: anthropics/claude-code-action@8041f1d17e0e7d2f2cfe35002962e9f26237c0bb # v1
        env:
          # The token sidecar's newest mint; the four writers read it at
          # each gh call (#1687).
          GH_TOKEN_FILE: ${{ runner.temp }}/app-token
          # Job-scoped token for gh writes; outlives the claude app
          # token, which expires ~1h into a session (issue #81).
          # Comments and issues only, never pushes or merges
          # (GOVERNANCE.md "Push identity").
          GH_WORKFLOW_TOKEN: ${{ github.token }}
          # gh-comment assembles the attribution footer from this.
          ROLE: curator
          # Admits tg-draft to the webhook worker's own surface, so the
          # operator's phone shows what this run is doing (#742). Not a
          # Telegram credential.
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are on duty as the curator: the issue tracker is yours
            to keep routed, honest, and current (ADR-0044, your
            charter). Who owns what: agents/GOVERNANCE.md "Roles", when
            needed. Link research/JOURNAL.md when an idea was already
            tried there; enter it through its headings, never whole
            (ADR-0025).

            Work in priority order. A run with nothing to do is a
            good run; stop when the pass is done.

            1. Triage every issue missing a triage response, oldest
               first, up to 5 this run. Triage DECIDES, it does not
               just label. Every issue you touch leaves with exactly
               one realm label AND one of three fates: closed (done
               already, duplicate, or no longer makes sense; say why,
               courteously), labeled blocked-on-human with the exact
               ask, or accepted with a comment saying what acceptance
               means: the evidence it carries, what would finish it,
               and what it blocks or is blocked by. Accepted, it also
               carries its type where the queue reads one: `bug` for a
               defect with a repro, `enhancement` for a gap with a
               beneficiary, neither for a question or a charter;
               `agent-queue` ranks bug above plain above enhancement,
               and no other seat applies them. An issue already
               satisfied by shipped code is the cheapest close there
               is; check the tree before assuming it is open work. A
               new ledger issue is yours to label on triage. A product
               issue whose fix lands on README, the site, release notes
               or positioning also gets `marketing`, the herald's queue
               (ADR-0040); nothing else routes it there (#1216 named
               the herald as owner and reached no queue). It routes the
               whole issue, so a fix spanning that surface and src/ is
               split by seat, the surface half filed as its own
               `marketing` issue (#1145's rustdoc half had no owner).
            2. Replies: where an author answered your critique,
               respond this run: converge or concede. A disagreement
               that will not converge gets one comment naming it, and
               your final response flags it for the BDFL.
            3. Groom up to 3 open issues, longest-ungroomed first: skip
               any issue a `Groomed:` line of a curator ops-log post
               named in the last 7 days, because a silent groom moves
               no `updatedAt` (#1577), then longest-untouched.
               Staleness: does the claim still match the repo? Check,
               and cite what you checked. Duplicates: close the
               younger onto the older unless the younger is sharper.
               Scope braids: two ideas in one issue get asked to
               split, or split yourself by filing the second half and
               cross-linking. Missing evidence: a bug without a repro,
               an enhancement without a beneficiary, a number without
               a corpus; ask for exactly what is missing, nothing
               more. Labels and milestones are yours to correct
               silently; a thread holding a complete, verified diff
               with nothing left to build, waiting on a credential
               or a review alone, gets ready-to-ship (CLAUDE.md,
               labels). A title that no longer says what the issue
               asks is yours to sharpen, noting the old title in a
               comment. Another author's body text is never yours to
               edit.

            Hard rules: a machinery defect you find becomes an
            agent-system issue, never a PR. Security reports and
            advisories are the operator's alone; skip them. PRs are
            the reviewer's; you read them only to learn an issue's
            state. Only the BDFL or the operator removes
            blocked-on-human (the latch rule, GOVERNANCE.md).

            End of run: if you acted (closed, filed, labeled,
            critiqued) or groomed, post a summary on the ops-log issue
            with one `Groomed:` line naming every issue you groomed,
            commented or not; a run that did neither posts nothing there.
          # Bash is the one built-in offered: `--tools` hides, where
          # `--allowedTools` only pre-approves (#725). The curator judges
          # and routes, never modifies the tree (GOVERNANCE.md "Tool
          # envelopes", the reviewer precedent), and its one run measured
          # since #946 (37865759900, 33 calls) used Bash alone. Bash
          # unrestricted, same section.
          claude_args: |
            --append-system-prompt-file agents/personas/curator.md
            ${{ steps.guard.outputs.model_flag }}
            ${{ steps.guard.outputs.effort_flag }}
            --max-turns 200
            --tools "Bash"
            --allowedTools "Bash"

      - if: always() && steps.claude.outcome != 'skipped'
        uses: ./.github/actions/agent-pause
        with:
          token: ${{ github.token }}
          execution_file: ${{ steps.claude.outputs.execution_file }}
          model: ${{ steps.guard.outputs.model }}
          telegram_bot_token: ${{ secrets.MOTHERGOD_STATUS_BOT_TOKEN }}
          telegram_chat_id: ${{ vars.OPERATOR_TELEGRAM_CHAT_ID }}
          cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # This run's share of the operator's Telegram draft ends with the
      # run (#742): `run` alone, no `since`, because this seat answers no
      # operator message and must not settle one the BDFL still owes.
      # The action carries the rationale. Unconditional because the runs
      # that matter are the ones a condition would miss.
      - if: always()
        continue-on-error: true
        uses: ./.github/actions/typing-reset
        with:
          secret: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}

      - if: always() && steps.claude.outcome != 'skipped'
        continue-on-error: true
        uses: ./.github/actions/agent-audit
        with:
          token: ${{ github.token }}
          cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          role: curator
          execution_file: ${{ steps.claude.outputs.execution_file }}
          redact: |
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
            ${{ secrets.MOTHERGOD_ADMIN_TOKEN }}
            ${{ secrets.MOTHERGOD_STATUS_BOT_TOKEN }}
            ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Run notice: run-notice.py's docstring carries the why. Runs after
      # agent-audit because it reads that step's scrubbed files; a paused
      # run (claude skipped) sends nothing.
      - if: always() && steps.claude.outcome != 'skipped'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.MOTHERGOD_STATUS_BOT_TOKEN }}
          OPERATOR_TELEGRAM_CHAT_ID: ${{ vars.OPERATOR_TELEGRAM_CHAT_ID }}
        run: |
          .github/scripts/run-notice.py "${RUNNER_TEMP}/agent-audit" curator \
            | .github/scripts/tg-send --notice

      # The token sidecar's account (#1687): a mint that failed shows in
      # this run's log, not only as a long run's dead push.
      - if: always() && steps.claude.outcome != 'skipped'
        continue-on-error: true
        run: tail -n 2 "${RUNNER_TEMP}/token-sidecar.log"
