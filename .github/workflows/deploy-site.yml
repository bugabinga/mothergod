# Deploy site/ (mothergod.dev) to Cloudflare Pages. Boring on purpose: no
# framework, no build step, wrangler pushes the static tree as-is.
name: deploy-site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-site.yml"
      - ".github/scripts/run-telemetry.py"
      - ".github/scripts/trust-telemetry.py"
      # /status-data.json sources (issue #95): a merge that moves one
      # redeploys the page the same hour; the daily cron catches the rest
      # (src/ line counts are deliberately not a trigger, codec merges are
      # too frequent to each buy a deploy).
      - ".github/scripts/status-data.py"
      - "ROADMAP.md"
      - "research/progress.jsonl"
      - "bench/baseline.json"
      - "src/lib.rs"
  # Daily refresh of /agent-metrics.json (issue #64); the page warns at 48h.
  schedule:
    - cron: "43 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read # run-telemetry.py lists and downloads audit artifacts

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # status-data.py publishes a 7-day commit count and refuses to
          # count a shallow clone.
          fetch-depth: 0
      # Status data for /status.html (issue #95): generated from repo
      # evidence (ROADMAP checkboxes, progress.jsonl, bench/baseline.json,
      # src/) on every deploy, never committed, same pattern and rationale
      # as agent-metrics.json below. The script nulls fields it cannot read
      # and exits 0; continue-on-error covers a crash before that, and the
      # page reports the missing file rather than breaking.
      - continue-on-error: true
        run: python3 .github/scripts/status-data.py site/status-data.json
      # Agent telemetry for /agents.html (issue #64): a stateless 7-day
      # window re-read from audit artifacts on every deploy, never a
      # committed data file, because concurrent agent appends to a tracked
      # file conflict (PR #34). The script writes a self-diagnosing JSON on
      # its own failures; continue-on-error covers a crash before that, and
      # the page reports the missing file rather than breaking.
      - continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/run-telemetry.py site/agent-metrics.json 7
      # Trust-ledger data for /status.html "Is it tested?" (#449,
      # ADR-0043): same stateless-artifact pipeline and failure contract
      # as run-telemetry.py above (self-diagnosing JSON on its own
      # failures; continue-on-error covers a crash before that).
      - continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/trust-telemetry.py site/trust-data.json
      - run: npx wrangler@4 pages deploy site --project-name=mothergod-site --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Not a secret: Cloudflare account ids are opaque identifiers, not
          # credentials. Needed because the API token is scoped to a single
          # account without implying it in every call.
          CLOUDFLARE_ACCOUNT_ID: c9526445475a4d62fd6e330810573ef0
