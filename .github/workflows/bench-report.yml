# Regenerates the published benchmark files on a runner and hands them back
# as an artifact, because the measurement outgrew a session (#1324):
# `silesia_report` times `mothergod` one file at a time (#1321, #1325), about
# 20 minutes for 212 MB, and a session's foreground command caps at 30 with
# background execution denied (CLAUDE.md rule 12).
#
# It runs unasked on a weekly clock and on a push to main that moves a pin
# below. `bench/baseline.json` because the gate's digest pin (#1254) makes
# every byte-moving codec PR commit it, so its merge is the codec's cue
# (two in the seven days to 2026-10-24, against 53 src/ commits); `src/`
# itself would run a pass per refactor, and nothing narrower than that file
# sees a reach-class change: #1423 moved six Silesia finals by up to 2.2%
# and no pinned bpb (#1434 is the long case the gate lacks).
# `bench/corpus.toml` because a moved pin is a different corpus.
# `bench/src/**` was on the list so that a change to the report binaries
# would regenerate what they print (#1356, #1367, #1373, #1376): the ten
# passes of those seven days answered frame_probe, corpus-fetch and
# gate-message merges, none moved a ratio, and each cost about fifty
# runner minutes plus a maintainer and a reviewer run to publish timing
# jitter (#1486 counts the hand edits). A change to the binaries now waits
# for the week's pass, which also carries the speed-only codec change
# nothing else triggers. A native cron, because this workflow exchanges no
# OIDC token (ADR-0035). `.github/scripts/bench-report` reads the push
# paths from this file, so the trigger and the detector cannot disagree,
# and tells the next heartbeat whether the newest pass is running,
# finished and waiting to be published, or owed a dispatch, the healing
# for one that failed or expired unpublished:
#   GH_TOKEN="$GH_WORKFLOW_TOKEN" gh workflow run bench-report.yml --ref main
# The publish PR the heartbeat cuts from the artifact is the reports' one
# writer, titled with the pass head so the next read learns the generator
# (ADR-0076); a codec PR commits `bench/baseline.json` and no report, and
# a reports commit naming no generator is stale by rule (#1381). This
# workflow never pushes: main takes PRs only (#583), and the publish PR
# carries the README and site quotes tests/claims.rs pins to the reports'
# timing columns, which the seat moves in the same diff (#1384).
name: bench-report

on:
  push:
    branches: [main]
    paths:
      - bench/baseline.json
      - bench/corpus.toml
      - .github/workflows/bench-report.yml
  schedule:
    # Saturday 03:17 UTC: the pass is done before the day's heartbeat
    # wakes publish it, and the Sunday survey reads the week's numbers.
    - cron: "17 3 * * 6"
  workflow_dispatch:

permissions:
  contents: read

# One pass per ref; a re-dispatch supersedes the one still running.
concurrency:
  group: bench-report-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    # The whole pass took 24 minutes on 2026-10-18 (run 39097554778:
    # build, baseline, Canterbury, Silesia at 0.188 MB/s); the runner CPU
    # moves it by a quarter either way (JOURNAL S2-A121). The competitor
    # matrix (#1340), 42 levels timed one process at a time on both
    # corpora, is unmeasured and serial by design; 180 is its ceiling
    # until its first run's wall time, read with
    #   gh run list --workflow bench-report.yml --json createdAt,updatedAt
    # replaces this sentence.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/rust-ci
        with:
          checks: setup
      # The commands `docs/benchmarks/README.md` "Regenerating" lists, in
      # its order, after the baseline `render_baseline_graph` draws.
      - run: cargo run -p mothergod-bench --release --bin baseline_gate -- write
      - run: cargo run -p mothergod-bench --release --bin render_baseline_graph
      - run: cargo x fmt -- docs/benchmarks/baseline.svg
      - run: cargo run -p mothergod-bench --release --features corpus-fetch --bin finals_report
      - run: cargo run -p mothergod-bench --release --features corpus-fetch --bin silesia_report
      - run: git --no-pager diff --stat >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bench-report
          path: |
            bench/baseline.json
            docs/benchmarks/baseline.md
            docs/benchmarks/baseline.svg
            docs/benchmarks/canterbury.md
            docs/benchmarks/silesia.md
          retention-days: 14
          if-no-files-found: error
