# Deslopper: six times a day, removes slop from src/ without changing
# behaviour. Slop is code that works and costs too much to read, change,
# and trust. The operating manual is .claude/skills/deslop/SKILL.md,
# read explicitly by path rather than invoked as a slash command, so the
# run does not depend on slash-command parsing inside the action.
#
# The deslopper never merges. It opens PRs and the reviewer decides;
# a PR the reviewer sends back is duty 1 of the next run.
name: agent-deslop

on:
  # Woken at 37 past every fourth hour UTC by the worker clock
  # (ADR-0035); the cron lines in infra/telegram-worker/wrangler.toml are
  # the cadence's source of truth. Never a native `schedule:` trigger
  # here: GitHub's schedule-actor attribution breaks the app-token
  # exchange on bot-edited files (GOVERNANCE.md "Push identity").
  workflow_dispatch:
    inputs:
      source:
        description: >-
          'cron' when the worker clock's tick dispatched this run
          (ADR-0035); left at the default for a human dispatch. Only
          the clock's tick is discretionary, so only it can be skipped
          by the allowance governor (ADR-0039).
        required: false
        default: ""

permissions: {}

# Per-agent group (ADR-0014): deslop runs debounce against each other
# only, never blocking another agent.
concurrency:
  group: agent-deslop
  cancel-in-progress: false

jobs:
  deslop:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - id: guard
        uses: ./.github/actions/agent-guard
        with:
          token: ${{ github.token }}
          cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          role: deslopper
          discretionary: ${{ inputs.source == 'cron' }}

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        if: steps.guard.outputs.paused != 'true'
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: steps.guard.outputs.paused != 'true'

      - id: claude
        if: steps.guard.outputs.paused != 'true'
        uses: anthropics/claude-code-action@db77d4d3c98f3f6380e7cd45ffba2342a3dbde3c # v1
        env:
          # Job-scoped fallback for gh writes after the claude app token
          # expires ~1h into a session (issue #81). Comments only, never
          # pushes or merges (GOVERNANCE.md "Push identity").
          GH_WORKFLOW_TOKEN: ${{ github.token }}
          # gh-comment assembles the attribution footer from this.
          ROLE: deslopper
          # Admits tg-draft to the webhook worker's own surface, so the
          # operator's phone shows what this run is doing (#742). Not a
          # Telegram credential.
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_commit_signing: true
          prompt: |
            Read first: .claude/skills/deslop/SKILL.md, your operating
            manual.

            Your territory is src/, plus the research/JOURNAL.md clause
            the skill's step 4 asks for: it rides in the deleting PR,
            never in an issue for the maintainer (#1409, #1585). A slop
            finding elsewhere is somebody else's, no PR for it.

            Work in strict priority order and STOP after ONE unit of
            work:
            1. Your own open PRs labeled changes-requested with no push
               after the verdict, or whose checks are red. Oldest first:
               check out the branch, fix it, `cargo x check`, push with
               `.github/scripts/push-branch`, then run
               `.github/scripts/settle-push <pr>` and trust its exit
               code, not the push's.
            2. Otherwise the oldest issue you filed, inside src/, with
               no open PR of yours closing it: `gh issue list --label
               product --search "deslopper in:body" --limit 100 --json
               number,title,createdAt`, oldest first; `gh pr list --limit 100
               --json number,closingIssuesReferences` says which are
               taken, GitHub's own parse, not a word search (#1428);
               one outside src/ stays the maintainer's. A scope already
               found and stated is a hunt already paid for: take it on
               a new branch claude/deslop-<slug>, `Closes #N` in the PR
               body. One whose finding no longer holds on main is
               closed with the reason (`gh-comment <N> --close`); a
               close is not the unit, move to the next.
            3. Otherwise hunt. Pick one scope per the Scope section of
               the skill, state it in one sentence, and execute the
               skill's procedure on a new branch claude/deslop-<slug>.

            The PR body is your only report. State: the scope in one
            sentence and why that scope; each defect removed and which
            taxonomy rule it violated; how behaviour preservation was
            proved, naming the commands you ran; the number of the issue
            you filed for any second scope you found (`gh-comment --new`,
            label product), never the scope as a sentence, because a
            body is not a queue. No severity ratings, no status
            headers. CHANGELOG.md only for a user-visible change, which
            most desloppings are not.
          # Bash unrestricted, per agents/GOVERNANCE.md "Tool envelopes".
          claude_args: |
            --append-system-prompt-file agents/personas/deslopper.md
            ${{ steps.guard.outputs.model_flag }}
            ${{ steps.guard.outputs.effort_flag }}
            --max-turns 400
            --allowedTools "Edit,Write,MultiEdit,Bash"

      - if: always() && steps.claude.outcome != 'skipped'
        uses: ./.github/actions/agent-pause
        with:
          token: ${{ github.token }}
          execution_file: ${{ steps.claude.outputs.execution_file }}
          model: ${{ steps.guard.outputs.model }}
          telegram_bot_token: ${{ secrets.MOTHERGOD_STATUS_BOT_TOKEN }}
          telegram_chat_id: ${{ vars.OPERATOR_TELEGRAM_CHAT_ID }}
          cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # This run's share of the operator's Telegram draft ends with the
      # run (#742): `run` alone, no `since`, because this seat answers no
      # operator message and must not settle one the BDFL still owes.
      # The action carries the rationale. Unconditional because the runs
      # that matter are the ones a condition would miss.
      - if: always()
        continue-on-error: true
        uses: ./.github/actions/typing-reset
        with:
          secret: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}

      - if: always() && steps.claude.outcome != 'skipped'
        continue-on-error: true
        uses: ./.github/actions/agent-audit
        with:
          token: ${{ github.token }}
          cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          role: deslopper
          execution_file: ${{ steps.claude.outputs.execution_file }}
          redact: |
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
            ${{ secrets.MOTHERGOD_ADMIN_TOKEN }}
            ${{ secrets.MOTHERGOD_STATUS_BOT_TOKEN }}
            ${{ secrets.CLOUDFLARE_API_TOKEN }}
