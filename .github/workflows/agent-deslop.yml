# Deslopper: twice a day, removes slop from src/ without changing
# behaviour. Slop is code that works and costs too much to read, change,
# and trust. The operating manual is .claude/skills/deslop/SKILL.md,
# read explicitly by path rather than invoked as a slash command, so the
# run does not depend on slash-command parsing inside the action.
#
# The deslopper never merges. It opens PRs and the reviewer decides;
# a PR the reviewer sends back is duty 1 of the next run.
name: agent-deslop

on:
  schedule:
    # 00:37 and 12:37 UTC. Off the hour and off the heartbeat's :52 on
    # purpose. Cron edits must land admin-PAT-attributed: an app-merged
    # cron edit flips the schedule actor to claude[bot], the token
    # exchange rejects bot actors, and every scheduled run dies
    # (GOVERNANCE.md "Push identity").
    - cron: '37 */12 * * *'
  workflow_dispatch:

permissions: {}

# Per-agent group (ADR-0014): deslop runs debounce against each other
# only, never blocking another agent.
concurrency:
  group: agent-deslop
  cancel-in-progress: false

jobs:
  deslop:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: guard
        uses: ./.github/actions/agent-guard
        with:
          token: ${{ github.token }}
          role: deslopper

      - uses: dtolnay/rust-toolchain@stable
        if: steps.guard.outputs.paused != 'true'
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        if: steps.guard.outputs.paused != 'true'

      - id: claude
        if: steps.guard.outputs.paused != 'true'
        uses: anthropics/claude-code-action@v1
        env:
          # Job-scoped fallback for gh writes after the claude app token
          # expires ~1h into a session (issue #81). Comments only, never
          # pushes or merges (GOVERNANCE.md "Push identity").
          GH_WORKFLOW_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_commit_signing: true
          prompt: |
            Read first, in this order: CLAUDE.md,
            .claude/skills/deslop/SKILL.md (your operating manual, with
            the taxonomy in its references/ directory), then
            agents/GOVERNANCE.md.

            Your territory is src/ and nothing else. Not docs, not
            .github, not agents/, not research/. A slop finding outside
            src/ is somebody else's; do not open a PR for it.

            Work in strict priority order and STOP after ONE unit of
            work:
            1. Your own open PRs whose latest reviewer verdict requests
               changes with no push after it, or whose checks are red.
               Oldest first: check out the branch, fix it, run every
               CLAUDE.md quality gate locally, push, then run
               `.github/scripts/settle-push <pr>`: it proves the push's
               runs are running and re-attributes them if GitHub held
               them at the approval gate (issue #57). Trust its exit
               code, not the push's. The reviewer posts its
               verdict as an issue comment starting "**Review verdict:",
               because the shared claude[bot] identity cannot formally
               review its own PRs.
            2. Otherwise hunt. Pick one scope per the Scope section of
               the skill, state it in one sentence, and execute the
               skill's procedure on a new branch claude/deslop-<slug>.

            The PR body is your only report. State: the scope in one
            sentence and why that scope; each defect removed and which
            taxonomy rule it violated; how behaviour preservation was
            proved, naming the commands you ran; any second scope you
            found and deliberately left. No severity ratings, no status
            headers.

            Hard rules: at most ONE new PR per run. Never merge
            anything, including your own PR: the reviewer is the
            approver. Never change observable behaviour. Never edit a
            test to make it pass. Update CHANGELOG.md only if the
            change is user-visible, which most desloppings are not.

            End every comment, issue, or PR body you post with the
            attribution footer: a blank line, `---`, then
            `_Generated by [Claude Code](https://claude.ai/code)_`.
          # Bash unrestricted, per agents/GOVERNANCE.md "Tool envelopes".
          claude_args: |
            --append-system-prompt-file agents/personas/deslopper.md
            ${{ steps.guard.outputs.model_flag }}
            ${{ steps.guard.outputs.effort_flag }}
            --max-turns 400
            --allowedTools "Edit,Write,MultiEdit,Bash"

      - if: always() && steps.claude.outcome != 'skipped'
        uses: ./.github/actions/agent-pause
        with:
          token: ${{ github.token }}
          execution_file: ${{ steps.claude.outputs.execution_file }}
          telegram_bot_token: ${{ secrets.MOTHERGOD_STATUS_BOT_TOKEN }}
          telegram_chat_id: ${{ vars.OPERATOR_TELEGRAM_CHAT_ID }}

      # Audit trail (operator directive): prompt and metadata in, final
      # response out. Never the transcript, which records command lines and
      # can carry credentials. Must not fail the run.
      - if: always() && steps.claude.outcome != 'skipped'
        continue-on-error: true
        uses: ./.github/actions/agent-audit
        with:
          role: deslopper
          execution_file: ${{ steps.claude.outputs.execution_file }}
          redact: |
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
            ${{ secrets.MOTHERGOD_ADMIN_TOKEN }}
            ${{ secrets.MOTHERGOD_STATUS_BOT_TOKEN }}
            ${{ secrets.CLOUDFLARE_API_TOKEN }}
