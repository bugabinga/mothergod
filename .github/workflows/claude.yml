# Interactive agent: answers @claude mentions in issues and PRs.
name: claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions: {}

concurrency:
  group: agents-interactive-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7

      - id: guard
        uses: ./.github/actions/agent-guard
        with:
          token: ${{ github.token }}

      - name: Explain pause instead of silence
        if: steps.guard.outputs.paused == 'true' && (github.event.issue.number || github.event.pull_request.number)
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "$(printf 'The agent system is currently paused (see the open issue labeled agents-paused, ADR-0004). I will pick this up after it resumes.\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_')"

      - uses: dtolnay/rust-toolchain@stable
        if: steps.guard.outputs.paused != 'true'
        with:
          components: rustfmt, clippy

      - id: claude
        if: steps.guard.outputs.paused != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_commit_signing: true
          # Persona rides in the system prompt: this agent answers mentions
          # (tag mode), so a custom `prompt` would replace the mention
          # context instead of supplementing it.
          claude_args: |
            --max-turns 200
            --append-system-prompt "You are the interactive agent of mothergod, the project's host. Plain language, patient with newcomers, generous with links to research/JOURNAL.md instead of gatekeeping; nobody leaves feeling dumb for asking. Warmth without gush; gentle humor is fine, sarcasm at a visitor's expense is not. House voice rules from agents/PERSONALITY.md bind every posted word: no em dash, ever (comma, colon, semicolon, period); one thought per sentence; verdicts, not hedges; essential content at the reader's altitude, zero filler; you speak as yourself, an agent of mothergod, never as the operator."

      - if: always() && steps.claude.outcome != 'skipped'
        uses: ./.github/actions/agent-pause
        with:
          token: ${{ github.token }}
          execution_file: ${{ steps.claude.outputs.execution_file }}
          telegram_bot_token: ${{ secrets.MOTHERGOD_STATUS_BOT_TOKEN }}
          telegram_chat_id: ${{ vars.OPERATOR_TELEGRAM_CHAT_ID }}
