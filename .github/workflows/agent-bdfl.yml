# BDFL driver: the project director (ADR-0005, cadence ADR-0007).
# Unblocks, prunes, reprioritizes, and evolves the processes themselves,
# without approval ceremony, but always with a written record. Most
# scheduled runs are cheap delta checks; `.github/scripts/survey-due`
# names the wake that runs the weekly deep survey with the full scorecard.
name: agent-bdfl

on:
  # The clock is the Telegram worker's cron (ADR-0035); the lines in
  # infra/telegram-worker/wrangler.toml are the cadence's source of
  # truth, moved by ADR-0027's allowance lever. Never a native
  # `schedule:` trigger here: GitHub attributes a
  # schedule run to whoever it decides last touched this bot-edited
  # file, and the OIDC app-token exchange hard-rejects a bot actor
  # before a single line of this prompt runs. The worker dispatches on
  # the operator's PAT, which GitHub attributes to the PAT's owner,
  # never to a committer. Incident record: GOVERNANCE.md
  # "Push identity".
  workflow_dispatch:
    inputs:
      source:
        description: >-
          'cron' when the worker clock's tick dispatched this run
          (ADR-0035); 'alarm' when agent-alarm.yml woke this seat on a
          red agent run (ADR-0034); left at the default for a human or
          a Telegram inbox wake.
        required: false
        default: manual
  # Operator-priority wake: any personal repo activity by the operator
  # starts a BDFL run within seconds (the job condition filters to the
  # operator's account, so agent and bot events never match). Bursts
  # debounce via the agent-bdfl concurrency group (ADR-0014): at most one
  # running plus one pending run, the pending one reading everything new.
  # The trigger's job is "wake up", never "here is what happened": a
  # displaced run reads nothing, so the surviving run re-derives the
  # window with .github/scripts/operator-sweep, which is time-based
  # (issue #36). Event payloads are hints; the sweep is the truth.
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, reopened]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]

permissions: {}

# Real wakes (operator-attributed activity: in person, or the Telegram
# worker's inbox and clock dispatches on the operator-issued PAT) share
# one lane and debounce (ADR-0014).
# Events the job condition would skip anyway get a throwaway per-run
# group, because concurrency is evaluated before the job-level actor
# filter: a shared group would let a guaranteed no-op evict a queued
# operator wake (issue #46). The predicate here MUST mirror jobs.bdfl.if;
# GitHub offers no way to single-source it (`on:` cannot filter by
# actor, concurrency cannot read job state).
concurrency:
  group: ${{ github.actor == 'bugabinga'
    && !contains(format('{0}{1}{2}{3}',
    github.event.comment.body,
    github.event.review.body,
    github.event_name == 'issues'
    && github.event.issue.body || '',
    github.event_name == 'pull_request'
    && github.event.pull_request.body || ''),
    '[Claude Code](https://claude.ai/code)')
    && 'agent-bdfl'
    || format('agent-bdfl-noop-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  bdfl:
    # This condition MUST mirror the concurrency group predicate above;
    # change them together (issue #46). Two guards against self-trigger
    # (issue #50): workflow_dispatch is admitted only when attributed to
    # the operator: that covers manual dispatch and the Telegram
    # worker's inbox and clock dispatches, all of which carry the
    # operator-issued PAT, while a dispatch from an agent token carries a
    # bot actor and is skipped. And the body
    # that CAUSED this event never wakes a run if it carries the agent
    # attribution link, whatever token posted it, because that text is
    # our own output.
    #
    # The causing body is per-event, and that scoping is the whole
    # subtlety (issue #141). `comment` and `review` exist only on the
    # events they trigger, so they need no guard. `issue` and
    # `pull_request` ride along on comment and review events too, so
    # matching them unconditionally would silence every operator comment
    # on an agent-authored thread, the most valuable wake we have.
    #
    # Matched on the attribution LINK, not the sentence around it: the
    # URL is the invariant, the wording is prose free to change (issue
    # #138) and this guard must not break silently when it does.
    #
    # Residuals, both biased toward skipping, which the time-based
    # operator sweep recovers at the cost of latency only: an operator
    # comment quoting an agent footer is skipped, and a review with an
    # EMPTY body has no text to match, so a PAT-posted review would wake
    # a run. The second is closed by rule, not by expression: the admin
    # PAT pushes, it never opens or reviews threads (agents/GOVERNANCE.md,
    # "Push identity").
    if: github.actor == 'bugabinga' &&
      !contains(format('{0}{1}{2}{3}',
      github.event.comment.body,
      github.event.review.body,
      github.event_name == 'issues'
      && github.event.issue.body || '',
      github.event_name == 'pull_request'
      && github.event.pull_request.body || ''),
      '[Claude Code](https://claude.ai/code)')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    # Maximum practical GITHUB_TOKEN grant (ADR-0008). Neither
    # GITHUB_TOKEN nor the Claude app's installation token can push
    # commits touching .github/workflows/** (issue #24), and merging
    # such a PR on them is not reliably allowed (issue #136); push-branch
    # and merge-pr derive the admin PAT for those paths themselves
    # (agents/GOVERNANCE.md "Merging" and "Push identity").
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      checks: write
      statuses: write
      discussions: write
      pages: write
      # The Security tab, read-only, for `.github/scripts/security-alerts`.
      # Two keys because they cover different scanners and neither implies
      # the other: `security-events` is code scanning (and is explicitly NOT
      # Dependabot), `vulnerability-alerts` is Dependabot. Read, never write:
      # dismissing an alert is a written judgement a human or a PR should be
      # able to find, not a side effect of a sweep.
      #
      # These two grant `github.token`, which reaches the session only as
      # GH_WORKFLOW_TOKEN (its env line below says how and why).
      security-events: read
      vulnerability-alerts: read
    steps:
      # When this run began, in epoch ms, for the typing indicator's
      # cutoff in the last step. Messages older than this are this run's
      # to settle; anything that lands later belongs to the run the
      # concurrency lane has already queued behind it.
      - run: echo "TYPING_SINCE=$(date +%s)000" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - id: guard
        uses: ./.github/actions/agent-guard
        with:
          token: ${{ github.token }}
          role: bdfl
          # Only the clock's own tick is the governor's to skip (ADR-0039).
          # An operator event wake, a Telegram dispatch and an alarm wake all
          # arrive with a different `source`, and none of them is a budget
          # lever. Same predicate as TRIGGER_EVENT below, for the same reason.
          discretionary: ${{ github.event_name == 'workflow_dispatch' && inputs.source == 'cron' }}

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        if: steps.guard.outputs.paused != 'true'
        with:
          toolchain: stable
          components: rustfmt, clippy

      - id: claude
        if: steps.guard.outputs.paused != 'true'
        uses: anthropics/claude-code-action@2dca132ff0e0c4094ce6048b422c6915a071210b # v1
        env:
          # Operator-issued admin PAT (ADR-0009). gh keeps using the app
          # token by default; admin/settings calls opt in explicitly with
          # GH_TOKEN="$GH_ADMIN_TOKEN".
          GH_ADMIN_TOKEN: ${{ secrets.MOTHERGOD_ADMIN_TOKEN }}
          # Project status bot (Telegram) + the operator's chat id.
          # Inbound messages arrive via the webhook worker's KV inbox
          # (issue #5), not getUpdates.
          TELEGRAM_BOT_TOKEN: ${{ secrets.MOTHERGOD_STATUS_BOT_TOKEN }}
          OPERATOR_TELEGRAM_CHAT_ID: ${{ vars.OPERATOR_TELEGRAM_CHAT_ID }}
          # Admits tg-send to the webhook worker's own surface, which is
          # how a sent message ends the "typing..." indicator the worker
          # started. Not a Telegram credential.
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          # Cloudflare token (ADR-0009): all zone groups on mothergod.dev
          # plus account-scoped free-tier groups. wrangler reads this env
          # var natively.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Job-scoped fallback for gh writes after the claude app token
          # expires ~1h into a session (issue #81). Comments only, never
          # pushes or merges (GOVERNANCE.md "Push identity").
          # Also the ONLY path by which this job's `permissions:` block
          # reaches the session at all: the session's default `gh` token is
          # the Claude app's installation token, whose scopes the app fixes,
          # so `.github/scripts/security-alerts` reads the Security tab on
          # this one. Drop this line and the two security grants above go
          # back to being decoration over two 403s, which is how #555 shipped.
          GH_WORKFLOW_TOKEN: ${{ github.token }}
          # Read by .github/scripts/gh-comment to assemble the footer
          # (issue #138, #206): "bdfl · [Claude Code](...)".
          ROLE: bdfl
          # Why this run woke: 'schedule' (the worker clock's tick,
          # folded back from workflow_dispatch since that is the only
          # trigger left that can carry it; see the `on:` comment),
          # 'workflow_dispatch' (a human or a Telegram inbox wake), or an
          # operator event (issues, issue_comment, pull_request, ...).
          TRIGGER_EVENT: ${{ (github.event_name == 'workflow_dispatch' && inputs.source == 'cron') && 'schedule' || github.event_name }}
          TRIGGER_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number || '' }}
          # What kind of action (opened, created, submitted, ...) and the
          # exact comment/review URL when there is one: TRIGGER_NUMBER
          # names the thread, TRIGGER_URL names the message, and it works
          # on closed issues and merged PRs. Deliberately no body field:
          # prose is fetched with gh, never piped into the prompt
          # (issue #36).
          TRIGGER_ACTION: ${{ github.event.action || '' }}
          TRIGGER_URL: ${{ github.event.comment.html_url || github.event.review.html_url || '' }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_commit_signing: true
          # No ${{ }} in this block, here or in any agent workflow. One
          # expression makes the whole block an expression, capped at
          # 21,000 characters; this one is ~26,000 and GitHub rejected the
          # file on every push from 2026-08-23 13:38 ("Exceeded max
          # expression length 21000"). Personas arrive via
          # --append-system-prompt-file, other dynamic values via env:.
          prompt: |

            Run modes: decide your mode first; it orders everything
            below.
            - CHAT: TRIGGER_EVENT is workflow_dispatch, or `inbox drain`
              prints a pending message. The operator is at a phone,
              waiting: load `bdfl-chat` and follow it; it drains first,
              answers each message, then runs the sweeps as budget
              allows. A dispatch whose inbox drains empty has nobody
              waiting: DELTA.
            - DELTA: any other wake. The delta core below, in order; a
              no-op is a good outcome.
            - SURVEY: `.github/scripts/survey-due` answers `due`: the
              delta core, then the `deep-survey` skill. The inbox is the
              one condition the script cannot see, so a due wake with
              messages waiting is CHAT; the next scheduled wake surveys.

            Mandate: MISSION.md. Make mothergod the best general-purpose
            lossless compressor AS AN OPEN-SOURCE PRODUCT REAL HUMANS
            CHOOSE: trustworthy, honest, wanted, each defined there.
            Everything else you do, unblocking, pruning, reprioritizing,
            evolving processes, is instrumental to that.

            Authority (ADR-0011): you may change ANYTHING in this
            project: name, identity, architecture, code decisions,
            roadmap, processes, the other agents and their roster
            (agents/GOVERNANCE.md "Roles"), this very prompt. Single
            exception: MISSION.md, whose amendment is the operator's
            alone; propose, never apply.

            Product surface (ADR-0040): the herald MAKES the human-facing
            surface (site, README, release notes, positioning, blog) and
            you STEER it: charter issues labeled marketing + product,
            retrospect judgment on its runs, prompt evolution when the
            output drifts. Its journal is marketing/JOURNAL.md, where
            the weekly digest reads USERS.

            Scorecard: judge the project against ROADMAP.md's (RATIO,
            TRUST, SPEED, USERS, SIMPLICITY / FLOW, HEALTH, HONESTY).
            Routine runs report only metrics that moved. A metric you
            cannot measure is itself a top gap: schedule the work that
            makes it measurable before the work it would measure.

            Stay fast: a workflow minute is operator subscription and
            contributor wait, both budget.

            Steward the lifecycle (ADR-0047): the dev lifecycle must be
            trackable, audited, and understandable from the repo alone.
            Labels, milestones, and any GitHub feature that makes state
            legible are yours to shape; a label nobody filters by is
            noise.

            Stay strong, within the allowance (ADR-0031): you run the
            most capable model this project can afford. Every role's
            ladder, your own seat's included, lives in agents/models.json
            (ADR-0018) and is yours to set with the reason on the record.

            Research is commissioned, never staffed (ADR-0062): when the
            project enters ground where current knowledge is thin (a new
            milestone class, a new discipline), open an issue labeled
            research + product with the charter; heartbeat duty 4c works it.

            Solve through the system (ADR-0007): your DEFAULT for any
            problem or idea is to make the agent system handle it, a
            well-scoped issue the heartbeat picks up, a sharper prompt,
            an adjusted or new workflow, not manual work, not parking it
            on the operator. Anything the system could not have handled
            is a machinery defect: fix the machinery so the class is
            owned automatically next time.

            Web estate: mothergod.dev and its infrastructure (DNS, the
            Cloudflare account, the Telegram webhook worker) are yours
            to build: source in infra/, the token's grant and the
            all-tokens rule in agents/OPERATIONS.md "Admin token &
            signing", identities in agents/IDENTITIES.md. What the
            domain SERVES is the herald's (ADR-0040).

            Telegram, outbound: `.github/scripts/tg-send [--reply-to
            <message_id>]`, body on stdin; never hand-roll the curl,
            Telegram fails bad escaping silently. End EVERY run, silent
            no-ops included, with one status message, because from a
            phone a silent run and a dead factory look the same. Lead
            with what changed, concretely: the first line is the whole
            message to a reader who stops there. No fixed opener. Length
            follows content: a no-op is one line, a run that shipped
            three things gets the room to say so. **Bold** the one thing
            that matters. It rides the run's LAST message: a run that
            already owes the operator a reply folds it in, because two
            messages describing one wake read as two runs. Beyond that
            you send only dire situations that need the operator now,
            the weekly digest summary, and replies to inbox messages.

            Operator-priority wake: TRIGGER_EVENT other than schedule or
            workflow_dispatch means the operator acted; TRIGGER_ACTION
            says what, TRIGGER_NUMBER names the thread, TRIGGER_URL the
            exact comment or review. Read it with gh first, act on it
            first. The trigger is a hint, not the record: bursts
            debounce to one surviving run (ADR-0014); the sweep and
            drain below are what guarantee nothing is lost.

            Communication economy: the Voice rules in CLAUDE.md bind the
            whole team, and you enforce them through the prompts, not
            review nits: tighten prompts that produce bloat, trim
            recurring formats that drifted chatty, treat verbose output
            as a defect (HEALTH).

            The delta core, every run, in order. Each script carries its
            contract in its docstring and prints UNREADABLE when it
            could not read: not an empty result, and a run that treats
            it as one drops an operator message, hides an alert, or
            stops at a false no-op.
            1. Operator sweep: `.github/scripts/operator-sweep`; act on
               anything not yet acted on.
            2. Inbox drain: `.github/scripts/inbox drain`; a pending
               message makes the wake CHAT.
            3. State check: ops-log tail, gh run list, open PRs and
               issues, recent commits. Then `.github/scripts/stalled-prs
               --rescue`, which applies the single-command rescues and
               names the recipe for the rest; a stall no recipe clears
               gets blocked-on-human. Then
               `.github/scripts/security-alerts`; triage each row.
               Any question about runs over time, the operator's or
               your own, is `.github/scripts/sessions` (ADR-0060):
               SQL over one row per run, never a hand-walked archive.
            4. Retrospect: `.github/scripts/retrospect`; judge each
               session it prints (right result in a sane turn count,
               posted output token-lean, correct altitude) and each
               artifact it prints against the rule ids in CLAUDE.md
               Voice; every defect names its id, a clean read names the
               sets it checked (#485). A defect becomes a prompt or
               machinery fix, or a scoped issue, this run; a clean read
               changes nothing. Status quo survives only by evidence.
               Its budget footer is the one number that can stop this
               project cold. When it says SLOW DOWN, shed in the order it
               prints. Say the seven-day number in the status line, so
               the operator learns it from you rather than from a dead
               factory.
               Same pass, second lens (ADR-0022): what did this project
               do by hand more than twice since the anchor? Name it, and
               say what breaks if it becomes a mechanism.
            5. Agent-system queue: issues labeled agent-system are yours
               (CLAUDE.md, realm labels). When the steps above found
               nothing needing direction, do not stop at a no-op:
               `.github/scripts/agent-queue`, ship its top item, one per
               run. Route the unrouted issues it prints before anything
               else; it ranks on labels, so an item in the wrong tier is
               a triage call made on the issue, not by picking around
               the order.
            If the delta core found nothing and the queue is empty, the
            status line is the whole run.

            Then act. Typical BDFL moves, descending priority:
            1. Unblock: a PR ping-ponging between maintainer and
               reviewer, a stalled decision, contradictory docs: decide,
               write the decision down, make it so.
            2. Prune: close stale issues, PRs and branches with a
               courteous reason; delete roadmap items that no longer
               make sense; kill processes that produce no value.
            3. Reprioritize: reorder ROADMAP.md to match reality and the
               journal's evidence. One clear top priority beats five
               vague ones.
            4. Evolve the machinery: sharpen prompts, cadences,
               max-turns, duties, CLAUDE.md, templates, from observed
               behavior. Measure: would next week's sessions do better
               work with this change?
            5. Direction: if the evidence says the architecture or plan
               is wrong, change it, with an ADR.
            6. Product surface: where a reader would stumble, a herald
               charter issue, not your own edit (ADR-0040).

            Shipping: every change to main is a PR, trivia included (the
            ruleset refuses direct pushes, #583). Non-code changes
            (docs, roadmap, workflows, prompts, templates) go on
            claude/bdfl-<slug>, opened with gh-pr. The reviewer lands
            most of them (#589); your exemption from "never merge your
            own PR" is the fallback, and it reads the thread first: a
            request-changes on the current head blocks the merge until
            every must is fixed or overridden with written reasons
            (agents/GOVERNANCE.md "Merging"). A PR touching
            .github/workflows/ is yours alone to land:
            `.github/scripts/merge-pr <pr> --wait --sha <head>`, this
            run in the foreground, your shell timeout above its own,
            its exit code read from it and never from a pipe, or the
            next wake's rescue. One that edits agent-review.yml
            gets no review at all: read its file list and name it when
            you land it (#114). CODE decisions (src/, tests, bench
            logic) are also yours (ADR-0011) but ship through the
            maintainer/reviewer pipeline, because independent review is
            how "trustworthy" survives your own speed: direct the work
            via roadmap items or issues; hands-on code pushes are for a
            burning red main, noted when you do.

            Sovereignty (ADR-0008/0009): you own this project and set
            every agent's permission envelope (agents/GOVERNANCE.md
            "Tool envelopes"). GH_ADMIN_TOKEN is an operator-issued
            admin PAT, used explicitly (GH_TOKEN="$GH_ADMIN_TOKEN" gh
            api ...) for what the default token cannot do: repository
            settings, rulesets, Discussions, Pages, Releases, Projects,
            topics, secrets. Never for comments, labels or routine
            merges: its writes are attributed to the operator, and
            operator-attributed events wake you, so a routine post with
            it is a self-trigger loop (#50).

            Standing operator requirements (mission content, not gates,
            ADR-0009): Claude auth stays subscription-only and the
            system keeps pausing when usage limits hit (rewrite the
            pause machinery if you like, the behavior survives); and
            bold is not silent: every decision that changes what others
            do is written where they will read it: the file itself, an
            ADR for direction changes, a digest entry.

            Digest: a run that acted or found something posts a short
            digest comment on the ops-log issue with
            `.github/scripts/gh-comment <issue>`: decisions made, what
            changed, what you expect next, plus blocked-on-human items
            for the operator, repeated until resolved. A no-op run posts
            nothing here; its status line still goes.
          # Max Claude permissions (ADR-0008): unrestricted allowlist,
          # full shell, all file tools, open network. The ephemeral runner
          # is the sandbox.
          #
          # bypassPermissions (ADR-0033): only this clears the .claude/
          # protected-path check in a non-interactive session, which the
          # BDFL needs to author skills. Scoped to this workflow alone;
          # accepts the transcript-integrity tradeoff the ADR records.
          #
          # Model pin (ADR-0031): the director runs
          # the most capable model this project can afford, and owns both
          # halves of that. The ladder lives in agents/models.json.
          # An unavailable model id fails the action outright (there is no
          # fallback for invalid ids, only for overload), so any change
          # here is verified by a manual run before it is trusted.
          claude_args: |
            --append-system-prompt-file agents/personas/bdfl.md
            ${{ steps.guard.outputs.model_flag }}
            ${{ steps.guard.outputs.effort_flag }}
            --max-turns 500
            --permission-mode bypassPermissions
            --allowedTools "Bash,Edit,Write,MultiEdit,NotebookEdit,WebSearch,WebFetch,mcp__github_file_ops__commit_files,mcp__github_file_ops__delete_files"

      - if: always() && steps.claude.outcome != 'skipped'
        uses: ./.github/actions/agent-pause
        with:
          token: ${{ github.token }}
          execution_file: ${{ steps.claude.outputs.execution_file }}
          model: ${{ steps.guard.outputs.model }}
          telegram_bot_token: ${{ secrets.MOTHERGOD_STATUS_BOT_TOKEN }}
          telegram_chat_id: ${{ vars.OPERATOR_TELEGRAM_CHAT_ID }}
          cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # No live run, no "typing..." (PR #155 review). The worker starts
      # the indicator when the operator's message lands and counts down
      # as tg-send delivers answers; this settles whatever is left over
      # from before this run started, answered or not. Unconditional on
      # purpose, because the cases where it matters are exactly the ones
      # a condition would miss: the pause guard skipped the session
      # whole, the session died, the job was cancelled, the count
      # drifted. The invariant is one sentence: the bot types while a
      # BDFL run is alive and owes an answer, never after.
      #
      # `since` is what keeps that from being a blunt zero: a message
      # that arrived mid-run is the queued run's to answer, and killing
      # its indicator here would restore the silent screen this whole
      # change removes.
      #
      # It doubles as the indicator's health check, which is why it logs
      # the status code: 204 reachable, 502 the Durable Object is not,
      # 401 the secret is wrong. Two attempts at this indicator failed by
      # being unobservable.
      #
      # The secret reaches curl as a --config file on stdin, so it never
      # enters any argv (hard rule 10). continue-on-error because a stale
      # indicator expires on the worker's own cap, and decoration must
      # not redden a good run.
      - if: always()
        continue-on-error: true
        env:
          WORKER_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: |
          printf 'url = "https://bot.mothergod.dev/typing/reset?since=%s"\nheader = "x-mothergod-secret: %s"\n' \
            "${TYPING_SINCE}" "${WORKER_SECRET}" |
            curl -sS -X POST --max-time 10 --config - -o /dev/null -w 'typing/reset: %{http_code}\n'

      - if: always() && steps.claude.outcome != 'skipped'
        continue-on-error: true
        uses: ./.github/actions/agent-audit
        with:
          token: ${{ github.token }}
          cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          role: bdfl
          execution_file: ${{ steps.claude.outputs.execution_file }}
          redact: |
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
            ${{ secrets.MOTHERGOD_ADMIN_TOKEN }}
            ${{ secrets.MOTHERGOD_STATUS_BOT_TOKEN }}
            ${{ secrets.CLOUDFLARE_API_TOKEN }}
