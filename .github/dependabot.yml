version: 2
updates:
  # `/` alone scans .github/workflows and a root action.yml, never
  # .github/actions/ (#267 bumped upload-artifact in a workflow and left
  # agent-audit/action.yml on v4). Groups: one PR per ecosystem per week;
  # security updates stay immediate and ungrouped.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
  # x/ and fuzz/ each declare their own [workspace] table (cargo-x and
  # cargo-fuzz both require a standalone workspace), so they are not part
  # of the root's and `/` alone would not discover them.
  - package-ecosystem: cargo
    directories:
      - /
      - /x
      - /fuzz
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns:
          - "*"
