# Telegram webhook worker (issue #5). Deployed by
# .github/workflows/deploy-telegram-worker.yml on push to main.
# Secrets WEBHOOK_SECRET, GITHUB_PAT and BOT_TOKEN are pushed by that
# workflow from repo secrets TELEGRAM_WEBHOOK_SECRET /
# TELEGRAM_GITHUB_PAT / MOTHERGOD_STATUS_BOT_TOKEN.
name = "mothergod-telegram"
main = "worker.js"
compatibility_date = "2026-08-01"
workers_dev = false

routes = [{ pattern = "bot.mothergod.dev", custom_domain = true }]

kv_namespaces = [
  # mothergod-telegram-inbox: pending operator updates, deleted by the
  # BDFL run after processing.
  { binding = "INBOX", id = "06ae14f739f14d55b5d3c72c6b7e815f" },
]

# The "typing..." indicator needs a timer that outlives the request that
# starts it, and a Durable Object alarm is the only Workers primitive
# that provides one. SQLite-backed, which is what the free plan offers.
[[durable_objects.bindings]]
name = "TYPING"
class_name = "Typing"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Typing"]

[vars]
# Not secrets: chat ids and repo slugs are identifiers, not credentials.
OPERATOR_CHAT_ID = "66834832"
GITHUB_REPO = "bugabinga/mothergod"

# The agent clock (ADR-0035): these lines are the single source of
# truth for how often the seats are woken. Each expression fires
# worker.js's `scheduled`, whose CLOCK table maps it to the seats it
# wakes. They set the ceiling, not the rate: agent-guard skips a
# computed share of these wakes while the allowance projection misses
# the reset (ADR-0039), so tune these for how fast the factory should
# react and let the governor decide what it can afford.
[triggers]
crons = ["11 */4 * * *", "22 */3 * * *", "37 */12 * * *"]
